# Wikidata subjects imported into the live HeritageGraph.
#
# `tools/fetch_wikidata_heritage.py` reads this file, fetches the subjects, the
# items their statements point to, and the administrative chain above every
# place, and freezes the result in heritage-snapshot.json. The importer
# (`manage.py import_wikidata_heritage`) only ever reads the frozen snapshot, so
# an import is reproducible from the repository alone.
#
# `seeds` are hand-picked; each QID was checked against its Wikidata label and
# description before being listed. `key` is the HeritageGraph registry key the
# subject is imported as; `type`, where given, fills the Tradition type choice.
# `sweeps` pull every item of a class in Nepal.

sweeps:
  - key: structure
    note: every place of worship (and subclass) located in Nepal
    class: Q1370598
    country: Q837


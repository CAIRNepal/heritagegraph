name: Ontology registry

on:
  push:
    paths:
      - "ontology/**"
      - "tools/ui-classmap.yaml"
      - "tools/ui-presentation.yaml"
      - "tools/contribute-hub.yaml"
      - "tools/linkml_generate_registry.py"
      - "tools/generate_serializers.py"
      - "heritage_graph/apps/cidoc_data/ontology_builder.py"
      - "heritage_graph/apps/cidoc_data/cidoc_registry_keys.py"
      - "heritage_graph_ui/src/lib/ontology/registry.generated.json"
      - "heritage_graph_ui/src/lib/ontology/registry.generated.ts"
      - "heritage_graph_ui/src/lib/ontology/__generated__/**"
      - "heritage_graph/apps/graph/ontology_config.py"
      - "heritage_graph/apps/cidoc_data/serializers.generated.py"
      - "ontology/shapes/generated-heritagegraph-minimal-shacl.ttl"
      - "tools/gen_heritage_viz_config.py"
      - "tools/emit_minimal_shacl.py"
  pull_request:
    paths:
      - "ontology/**"
      - "tools/ui-classmap.yaml"
      - "tools/ui-presentation.yaml"
      - "tools/contribute-hub.yaml"
      - "tools/linkml_generate_registry.py"
      - "tools/generate_serializers.py"
      - "heritage_graph/apps/cidoc_data/ontology_builder.py"
      - "heritage_graph/apps/cidoc_data/cidoc_registry_keys.py"
      - "heritage_graph_ui/src/lib/ontology/registry.generated.json"
      - "heritage_graph_ui/src/lib/ontology/registry.generated.ts"
      - "heritage_graph_ui/src/lib/ontology/__generated__/**"
      - "heritage_graph/apps/graph/ontology_config.py"
      - "heritage_graph/apps/cidoc_data/serializers.generated.py"
      - "ontology/shapes/generated-heritagegraph-minimal-shacl.ttl"
      - "tools/gen_heritage_viz_config.py"
      - "tools/emit_minimal_shacl.py"

jobs:
  check-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LinkML dependencies for ontology-check
        run: pip install linkml
      - name: Verify all generated files are up to date
        run: make check

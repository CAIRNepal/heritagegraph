# ================================================================
# HeritageGraph Docker Compose — Dokploy deployment
# ================================================================
# Same topology as docker-compose-coolify.yml (platform provides the proxy).
#
# DOKPLOY SETUP
# 1. New Compose project → point at this file in the repo (repository root).
# 2. Set environment variables in Dokploy (secrets + URLs).
# 3. Map domains to services / ports:
#    - API host  → backend : 8000
#    - App host  → frontend : 3000
#    - Landing   → landing : 3000
# 4. ALLOWED_HOSTS must include your public API hostname AND the Docker
#    service name `backend` (Host: backend:8000 from NextAuth server-side).
#
# MIGRATION_AUTO_REPAIR=1 runs repair_migration_history before migrate to fix
# InconsistentMigrationHistory (admin before users) on first boot.
# ================================================================

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heritage_db}
      POSTGRES_USER: ${POSTGRES_USER:-heritage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      internal:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heritage_user} -d ${POSTGRES_DB:-heritage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: heritage_graph.settings.production
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      # Override in Dokploy: devapi.example.com,app.example.com,localhost,backend
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api.heritagegraph.xyz,localhost,backend}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-heritage_db}
      DB_USER: ${POSTGRES_USER:-heritage_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: 5432
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://heritagegraph.xyz,https://heritagegraph.xyz}
      MIGRATION_AUTO_REPAIR: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-static:/app/heritage_graph/staticfiles
      - backend-media:/app/heritage_graph/media
    networks:
      - internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./heritage_graph_ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-build-placeholder}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-build-placeholder}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-build-placeholder}
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.heritagegraph.xyz}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://heritagegraph.xyz}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      INTERNAL_BACKEND_URL: http://backend:8000
    networks:
      - internal
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  landing:
    build:
      context: ./heritage_graph_landing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL:-}
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - internal
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  backend-static:
    driver: local
  backend-media:
    driver: local

networks:
  internal:
    driver: bridge

  - key: propose_identity_cluster
    userLabel: Propose a canonical identity cluster
    userDescription:
      Submit moderator-gated entity-cluster drafts when the same real-world referent might be
      split across records.
    hubCategory: general
    emoji: "🔎"
    difficulty: advanced
    journey: claim
    steps:
      - order: 1
        title: Open entity cluster proposal
        detail: >-
          Describe the cluster intent and evidence; curators review alongside other KG proposals.
        ctaRoute: /contribute/entity-proposal
        ctaLabel: Open entity proposal

  - key: cultural_entity_then_link
    userLabel: General heritage record, then graph links
    userDescription:
      Use the flexible cultural-entity form, then propose relationships once canonical CIDOC rows
      exist. Pick entity types manually on the proposal form—hints are not yet scoped to cultural entities.
    hubCategory: general
    emoji: "🏮"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Record the cultural entity
        ctaRoute: /contribute/cultural-entity
        ctaLabel: Open cultural entity form
      - order: 2
        title: Propose relationships to other records
        detail: >-
          Choose subject and object types from the proposal picker; align with predicates from the controlled list.
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal

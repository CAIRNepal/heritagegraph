    hubCategory: social
    emoji: "👥"
    difficulty: beginner
    journey: record
    steps:
      - order: 1
        title: Record the person
        ctaRoute: /contribute/person
        ctaLabel: Open person form
      - order: 2
        title: Record the Guthi
        ctaRoute: /contribute/guthi
        ctaLabel: Open Guthi form
      - order: 3
        title: Propose person ↔ Guthi link
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal
        linkQuery: subjectType=guthi&objectType=person

  - key: caste_ritual_specialists
    userLabel: Hereditary group and the ritual they carry
    userDescription:
      Document a Jati or ritual specialist group, describe the ritual they perform, then connect them.
    hubCategory: social
    emoji: "🪔"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Record the caste or social group
        ctaRoute: /contribute/caste-group
        ctaLabel: Open caste group form
      - order: 2
        title: Describe the ritual
        ctaRoute: /contribute/ritual
        ctaLabel: Open ritual form
      - order: 3
        title: Propose group ↔ ritual link
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal
        linkQuery: subjectType=castegroup&objectType=ritualevent

  - key: period_context_for_events

  - key: source_to_assertion
    userLabel: Source first, then a sourced assertion
    userDescription:
      Register the documentary source, then record a factual claim that cites it with confidence.
    hubCategory: provenance
    emoji: "📚"
    difficulty: intermediate
    journey: verify
    steps:
      - order: 1
        title: Add the source record
        ctaRoute: /contribute/source
        ctaLabel: Open source form
      - order: 2
        title: Record the assertion
        detail: >-
          Link the same source metadata you captured in step 1 when the assertion form asks for it.
        ctaRoute: /contribute/assertion
        ctaLabel: Open assertion form

  - key: document_then_bio
    userLabel: Document, then biographical subject
    userDescription:
      Catalog the witness record, capture the person's biography, then optionally propose a
      person–source graph link for moderators.
    hubCategory: provenance
    emoji: "👤"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Register the source
        ctaRoute: /contribute/source
        ctaLabel: Open source form
      - order: 2
        title: Record the historical person
        ctaRoute: /contribute/person
        ctaLabel: Open person form
      - order: 3
        title: Propose person ↔ source link
        detail: >-
          Choose the predicate that best matches how the source attests to the person.
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal

  - key: tradition_in_practice
    userLabel: Tradition and the ritual that enacts it
    userDescription:
      Capture the tradition, document a concrete ritual instance, then propose how they relate.
    hubCategory: conceptual
    emoji: "🕯️"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Record the tradition
        ctaRoute: /contribute/tradition

  - key: cross_tradition_deity_mapping
    userLabel: Mapping deities across traditions
    userDescription:
      Start from one deity identity, record syncretic or equivalence claims, then propose a
      second deity node and a moderated relationship between them.
    hubCategory: conceptual
    emoji: "🔗"
    difficulty: advanced
    journey: claim
    steps:

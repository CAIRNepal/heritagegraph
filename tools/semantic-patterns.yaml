# Human-centered workflow shells (semantic "templates") consumed by schema API + contribute UI.
# Keys must be URL-safe slug segments for /contribute/pattern/<key>.

patterns:
  - key: restoration_and_site_link
    userLabel: Document a restoration and link it to a site
    userDescription:
      Record what happened during a restoration project as a dated event,
      then propose a moderator-reviewed relationship tying that event to an
      architectural site or monument. Uses normal CIDOC-aligned forms—no RDF editing.
    hubCategory: events
    emoji: "🔧"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Describe the restoration
        detail: >-
          Capture dates, narratives, agents, or sources inside the Heritage Event record.
          Use type “Historical Event” for repairs, rebuilds, and conservation milestones.
        ctaRoute: /contribute/event
        ctaLabel: Open event form
      - order: 2
        title: Propose how the event touches a site
        detail: >-
          Submit a relationship proposal (subject = site or monument, object = event, or the reverse)
          so curators can align it with the controlled predicate vocabulary.
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal
        linkQuery: subjectType=architecturalstructure&objectType=event

  - key: ritual_with_performer
    userLabel: Record a ritual and its performers
    userDescription:
      Start from the ritual form, then connect people or deities with a separate relationship proposal.
    hubCategory: events
    emoji: "🪔"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Describe the ritual
        ctaRoute: /contribute/ritual
        ctaLabel: Open ritual form
      - order: 2
        title: Link performers or deities
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Propose relationships
        linkQuery: subjectType=ritualevent&objectType=person

  - key: place_then_structure_link
    userLabel: Place a site on the map, then link it to architecture
    userDescription:
      Capture the heritage location, describe the architectural structure that stands there,
      then propose a moderated relationship between place and building.
    hubCategory: tangible
    emoji: "🗺️"
    difficulty: beginner
    journey: record
    steps:
      - order: 1
        title: Record the place or site
        detail: >-
          Capture coordinates, toponyms, and context so the structure can be grounded spatially.
        ctaRoute: /contribute/location
        ctaLabel: Open location form
      - order: 2
        title: Describe the architectural structure
        detail: >-
          For stupas, chaityas, or dedicated sacred architecture you can use the Monument form
          instead (/contribute/monument) before the relationship step.
        ctaRoute: /contribute/structure
        ctaLabel: Open structure form
      - order: 3
        title: Propose place–structure link
        detail: >-
          Pick subject/object to match your narrative (e.g. structure ↔ place). Curators align
          predicates with the controlled vocabulary.
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal
        linkQuery: subjectType=architecturalstructure&objectType=location

  - key: place_then_monument_link
    userLabel: Place a monument, then tie it to its geography
    userDescription:
      Start from the map, record a Buddhist sacred structure, then propose how it sits in that place.
    hubCategory: tangible
    emoji: "⛩️"
    difficulty: beginner
    journey: record
    steps:
      - order: 1
        title: Record the location
        ctaRoute: /contribute/location
        ctaLabel: Open location form
      - order: 2
        title: Describe the monument
        ctaRoute: /contribute/monument
        ctaLabel: Open monument form
      - order: 3
        title: Propose monument–place link
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal
        linkQuery: subjectType=monument&objectType=location

  - key: deity_sacred_art_and_site
    userLabel: Deity, sacred art, then link the deity to built heritage
    userDescription:
      Register the deity, document iconography, then relate the art to built heritage using
      supported proposal types (the iconography record itself is not a proposal endpoint type yet).
    hubCategory: tangible
    emoji: "🎨"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Describe the deity
        ctaRoute: /contribute/deity
        ctaLabel: Open deity form
      - order: 2
        title: Document the iconographic object
        ctaRoute: /contribute/iconography
        ctaLabel: Open iconography form
      - order: 3
        title: Link deity to site or monument
        detail: >-
          Relate the deity to architecture you already recorded (adjust subject/object as needed).
          Keep notes referencing the iconography record from step 2.
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal
        linkQuery: subjectType=deity&objectType=architecturalstructure

  - key: festival_with_component_rituals
    userLabel: Festival with its component rituals
    userDescription:
      Outline the festival, capture the rituals that compose it, then propose how they connect.
    hubCategory: events
    emoji: "🎪"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Describe the festival
        ctaRoute: /contribute/festival
        ctaLabel: Open festival form
      - order: 2
        title: Record a component ritual
        detail: >-
          Repeat this step from the hub if multiple rituals belong to the same festival.
        ctaRoute: /contribute/ritual
        ctaLabel: Open ritual form
      - order: 3
        title: Propose festival–ritual link
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal
        linkQuery: subjectType=festival&objectType=ritualevent

  - key: historic_event_affected_site
    userLabel: Historic shock or change, then tie it to built heritage
    userDescription:
      Log earthquakes, fires, conflicts, or political transitions as events, document affected
      sites, then propose moderated relationships.
    hubCategory: events
    emoji: "⚡"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Describe the historic event
        ctaRoute: /contribute/event
        ctaLabel: Open event form
      - order: 2
        title: Update or add the affected structure
        detail: >-
          Use Structure or Monument depending on the asset type; note damage or change in the form.
        ctaRoute: /contribute/structure
        ctaLabel: Open structure form
      - order: 3
        title: Propose event ↔ site relationship
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal
        linkQuery: subjectType=event&objectType=architecturalstructure

  - key: kumari_lifecycle
    userLabel: Kumari selection, tenure, and retirement
    userDescription: >-
      Walk the Living Goddess workflow end-to-end: examination and selection, embodiment period,
      then the formal return to secular life.
    hubCategory: kumari
    emoji: "👑"
    difficulty: advanced
    journey: record
    steps:
      - order: 1
        title: Record the selection ritual
        ctaRoute: /contribute/kumari-selection
        ctaLabel: Open Kumari selection form
      - order: 2
        title: Document the tenure
        ctaRoute: /contribute/kumari-tenure
        ctaLabel: Open Kumari tenure form
      - order: 3
        title: Record retirement
        ctaRoute: /contribute/kumari-retirement
        ctaLabel: Open Kumari retirement form

  - key: guthi_and_managed_site
    userLabel: Guthi trust and the site it stewards
    userDescription:
      Register the endowed trust, describe the structure it cares for, then propose the stewardship link.
    hubCategory: social
    emoji: "🏘️"
    difficulty: intermediate
    journey: record
    steps:
      - order: 1
        title: Describe the Guthi
        ctaRoute: /contribute/guthi
        ctaLabel: Open Guthi form
      - order: 2
        title: Describe the managed structure
        ctaRoute: /contribute/structure
        ctaLabel: Open structure form
      - order: 3
        title: Propose Guthi ↔ site relationship
        ctaRoute: /contribute/relationship-proposal
        ctaLabel: Open relationship proposal
        linkQuery: subjectType=guthi&objectType=architecturalstructure

  - key: person_and_guthi_affiliation
    userLabel: Person and Guthi membership
    userDescription:

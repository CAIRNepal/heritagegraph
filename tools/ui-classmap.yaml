# UI class mapping for the YAML-driven schema registry.
# This keeps UI-facing metadata (key, endpoint, icon, category, labels) in YAML
# so it can be edited without touching TypeScript or Python code.
#
# This file is consumed by:
# - backend schema registry builder (Django)
# - offline generator (tools/linkml_generate_registry.py)
#
# Fields:
# - linkml: LinkML class name in `ontology/HeritageGraph.yaml`
# - key: UI registry key (used in routes/forms)
# - apiEndpoint: DRF collection endpoint (must match `heritage_graph/apps/cidoc_data/urls.py`)
# - icon/category/navigable/labels: UI hints
classes:
  - linkml: Person
    key: person
    apiEndpoint: /cidoc/persons/
    label: Historical Person
    labelPlural: Historical Persons
    navigable: true
    category: social
    icon: user

  - linkml: Place

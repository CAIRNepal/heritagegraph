# tools/ui-vizmap.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Presentational metadata for the HeritageGraph network visualization.
#
# This file holds ONLY visual/display config (colors, emojis, hgCategory).
# Semantic metadata (class_uri, slot_uri, CIDOC mappings) lives exclusively in
# ontology/HeritageGraph.yaml — this file references it but never duplicates it.
#
# Consumed by:
#   tools/gen_heritage_viz_config.py
#
# Outputs (do not edit by hand):
#   heritage_graph_ui/src/lib/ontology/__generated__/heritage-viz-config.ts
#   heritage_graph_ui/src/lib/ontology/__generated__/enums.ts
#   heritage_graph_ui/src/lib/ontology/__generated__/ontology-graph.ts
#   heritage_graph/apps/graph/ontology_config.py
#
# ─────────────────────────────────────────────────────────────────────────────
# ADDING A NEW NODE TYPE
#   1. Add / verify the class in ontology/HeritageGraph.yaml with a class_uri.
#   2. Add a new entry in node_types below.
#   3. Run: python3 tools/gen_heritage_viz_config.py
#   4. Commit all three changed files together.
# ─────────────────────────────────────────────────────────────────────────────

# Each node_type entry:
#   key          — TypeScript NodeType value (string key in generated config)
#   linkml_class — class name in ontology/HeritageGraph.yaml; generator resolves
#                  class_uri from there. Use an alias key when the VIZ type is a
#                  subtype or grouping that doesn't have its own schema class.
#   label        — Human-readable label for UI display
#   color        — Hex color for node fill
#   glow_color   — Hex color for node glow/highlight
#   emoji        — Single emoji for node icon
#   hg_category  — Graph domain category (must be a key in hg_categories below)

node_types:
  - key: Place
    linkml_class: Place
    label: Place
    color: "#30715d"
    glow_color: "#49c9a2"
    emoji: "\U0001F3D4"   # 🏔
    hg_category: spatial

  - key: Temple
    linkml_class: Temple
    label: Temple
    color: "#476a83"
    glow_color: "#72a4c8"
    emoji: "\U0001F6D5"   # 🛕
    hg_category: tangible

  - key: BuddhistMonument
    linkml_class: BuddhistMonument
    label: Buddhist Monument
    color: "#4b718c"
    glow_color: "#7baacc"
    emoji: "☸"       # ☸
    hg_category: tangible

  - key: ArchitecturalStructure
    linkml_class: ArchitecturalStructure
    label: Architectural Structure
    color: "#507894"
    glow_color: "#85b0cf"
    emoji: "\U0001F3DB"   # 🏛
    hg_category: tangible

  # Settlement is a Place subtype for urban settlements (no separate schema class)
  - key: Settlement
    linkml_class: Place
    label: Settlement
    color: "#347864"
    glow_color: "#51cba6"
    emoji: "\U0001F3D9"   # 🏙
    hg_category: spatial

  - key: Deity
    linkml_class: Deity
    label: Deity
    color: "#945072"
    glow_color: "#cf85aa"
    emoji: "\U0001FAB7"   # 🪷 lotus — sacred to Hindu & Buddhist deities (was ✨, which trivialised the concept)
    hg_category: conceptual

  - key: Festival
    linkml_class: Festival
    label: Festival
    color: "#a34c36"
    glow_color: "#de826b"
    emoji: "\U0001FA94"   # 🪔 diya lamp — South Asian festival symbol (was 🎉 party popper)
    hg_category: event

  - key: TimeSpan
    linkml_class: TimeSpan
    label: Time-Span
    color: "#546b5c"
    glow_color: "#7db28f"
    emoji: "\U0001F4DC"   # 📜
    hg_category: temporal

  - key: ReligiousTradition
    linkml_class: ReligiousTradition
    label: Religious Tradition
    color: "#9e557a"
    glow_color: "#d490b2"
    emoji: "\U0001F4FF"   # 📿 prayer beads / mala — shared Hindu & Buddhist (was 🎨 artist palette)
    hg_category: conceptual

  # SacredSite is an ArchitecturalStructure subtype for consecrated sacred spaces
  - key: SacredSite
    linkml_class: ArchitecturalStructure
    label: Sacred Site
    color: "#547e9c"
    glow_color: "#8db6d3"
    emoji: "\U0001F6D0"   # 🛐 place of worship — multi-faith sacred site (was 🌿 herb)
    hg_category: tangible

  - key: Person
    linkml_class: Person
    label: Person
    color: "#80611a"
    glow_color: "#e7ac24"
    emoji: "\U0001F464"   # 👤
    hg_category: actor

  - key: Guthi
    linkml_class: Guthi
    label: Guthi
    color: "#88681c"
    glow_color: "#e8b02d"
    emoji: "\U0001F465"   # 👥 community/trust institution — pairs with Person 👤 (was 🏘 houses)
    hg_category: actor

  - key: IconographicObject
    linkml_class: IconographicObject
    label: Iconographic Object
    color: "#5884a3"
    glow_color: "#95bbd6"
    emoji: "\U0001F5BC"   # 🖼
    hg_category: tangible

  # Named historical periods (Lichhavi, Malla, …) — a heritageGraph:HistoricalPeriod
  # (crm:E4_Period), the class instances are actually projected with.
  - key: HistoricalPeriod
    linkml_class: HistoricalPeriod
    label: Historical Period
    color: "#5a7262"
    glow_color: "#85b796"
    emoji: "⏳"       # ⏳
    hg_category: temporal

  # Source nodes are projected as heritageGraph:InformationObject (registry key
  # `source`); point the viz at the class the KG actually emits.
  - key: Source
    linkml_class: InformationObject
    label: Source
    color: "#676756"
    glow_color: "#afaf7f"
    emoji: "\U0001F4DA"   # 📚
    hg_category: provenance

  - key: HistoricalEvent
    linkml_class: HistoricalEvent
    label: Historical Event
    color: "#ae513a"
    glow_color: "#e18c77"
    emoji: "\U0001F4C5"   # 📅
    hg_category: event

  # ── Classes that appear in the KG but previously had no viz identity ───────
  - key: RitualEvent
    linkml_class: RitualEvent
    label: Ritual
    color: "#b8563d"
    glow_color: "#e39582"
    emoji: "\U0001F549"   # 🕉
    hg_category: event

  - key: CasteGroup
    linkml_class: CasteGroup
    label: Caste Group
    color: "#906e1e"
    glow_color: "#e9b336"
    emoji: "\U0001F46A"   # 👪
    hg_category: actor

  - key: LivingGoddessTenure
    linkml_class: LivingGoddessTenure
    label: Living Goddess Tenure
    color: "#5f7968"
    glow_color: "#8cbc9c"
    emoji: "\U0001F451"   # 👑
    hg_category: temporal

  - key: SyncreticRelationship
    linkml_class: SyncreticRelationship
    label: Syncretic Link
    color: "#a65b81"
    glow_color: "#d89ab9"
    emoji: "\U0001F517"   # 🔗
    hg_category: conceptual

  # ── LinkedArt/LUX interop node types (render imported Yale LUX entities) ──
  - key: HumanMadeObject
    linkml_class: HumanMadeObject
    label: Human-Made Object
    color: "#486d87"
    glow_color: "#76a7ca"
    emoji: "\U0001F3FA"   # 🏺
    hg_category: tangible

  - key: Group
    linkml_class: Group
    label: Group
    color: "#98741f"
    glow_color: "#eab63e"
    emoji: "\U0001F465"   # 👥
    hg_category: actor

  - key: Set
    linkml_class: Set
    label: Set / Collection
    color: "#6e6e5b"
    glow_color: "#b3b386"
    emoji: "\U0001F5C2"   # 🗂
    hg_category: provenance



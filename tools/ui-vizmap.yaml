# Slots from ontology/HeritageGraph.yaml that appear as edge labels in the
# graph visualization. The generator resolves slot_uri from the schema.
# Add the cidoc_note field only for custom HG properties not yet in the schema.

viz_predicates:
  - slot: has_current_location
    label: has current location
    # schema slot_uri: crm:P55_has_current_location

  - slot: is_component_of
    label: is component of
    # schema slot_uri: crm:P46i_forms_part_of

  - slot: associated_with
    label: associated with
    cidoc_note: "heritageGraph:associated_with"   # custom HG property, not yet in schema

  - slot: invokes_deity
    label: invokes deity
    # schema slot_uri: crm:P12_occurred_in_the_presence_of

  - slot: took_place_at
    label: took place at
    # schema slot_uri: crm:P7_took_place_at

  - slot: was_produced_by_event
    label: was produced by event
    # schema slot_uri: crm:P108i_was_produced_by

  - slot: was_derived_from_source
    label: was derived from source
    # schema slot_uri: prov:wasDerivedFrom

  - slot: has_component
    label: has component
    # schema slot_uri: crm:P46_is_composed_of

  - slot: carried_out_by
    label: carried out by
    # schema slot_uri: crm:P14_carried_out_by

  # ── Live-data backend edge labels ──
  # These are produced by heritage_graph_ui/src/lib/instance-graph.ts when
  # building edges from CIDOC API rawData. They do not correspond to LinkML
  # slots, so each carries a cidoc_note pointing to its nearest CIDOC analog.
  - slot: located_at
    label: located at
    cidoc_note: "crm:P53_has_former_or_current_location"

  - slot: co_located
    label: co-located with
    cidoc_note: "heritageGraph:co_located"

  - slot: mentions
    label: mentions
    cidoc_note: "heritageGraph:mentions"

  - slot: depicts
    label: depicts
    cidoc_note: "crm:P138_represents"

  - slot: manages
    label: manages
    cidoc_note: "heritageGraph:manages"

  - slot: tradition
    label: tradition
    cidoc_note: "heritageGraph:religious_tradition"

  - slot: style
    label: architectural style
    cidoc_note: "heritageGraph:architectural_style"

  - slot: type
    label: type
    cidoc_note: "crm:P2_has_type"

  - slot: structure_type
    label: structure type
    cidoc_note: "heritageGraph:structure_type"

  - slot: ritual_type
    label: ritual type
    cidoc_note: "heritageGraph:ritual_type"

  - slot: festival_type
    label: festival type
    cidoc_note: "heritageGraph:festival_type"

  - slot: guthi_type
    label: guthi type
    cidoc_note: "heritageGraph:guthi_type"

  - slot: monument_type
    label: monument type
    cidoc_note: "heritageGraph:monument_type"

  - slot: object_type
    label: object type
    cidoc_note: "heritageGraph:object_type"

  - slot: event_type
    label: event type
    cidoc_note: "heritageGraph:event_type"

  - slot: source_type
    label: source type
    cidoc_note: "heritageGraph:source_type"

  - slot: tradition_type
    label: tradition type
    cidoc_note: "heritageGraph:tradition_type"

  - slot: occupation
    label: occupation
    cidoc_note: "heritageGraph:occupation"

  - slot: performed_by
    label: performed by
    cidoc_note: "crm:P14_carried_out_by"

  - slot: technique
    label: technique
    cidoc_note: "crm:P32_used_general_technique"


# Subset of schema prefixes to emit into TypeScript and Python.
# Must be a subset of the prefixes defined in ontology/HeritageGraph.yaml.
# The generator validates this list against the schema and errors on unknown keys.

core_prefixes:
  - rdf
  - rdfs
  - owl
  - xsd
  - crm
  - heritageGraph
  - geo
  - prov

# tools/ui-vizmap.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Presentational metadata for the HeritageGraph network visualization.
#
# This file holds ONLY visual/display config (colors, emojis, hgCategory).
# Semantic metadata (class_uri, slot_uri, CIDOC mappings) lives exclusively in
# ontology/HeritageGraph.yaml — this file references it but never duplicates it.
#
# Consumed by:
#   tools/gen_heritage_viz_config.py
#
# Outputs (do not edit by hand):
#   heritage_graph_ui/src/lib/ontology/__generated__/heritage-viz-config.ts
#   heritage_graph_ui/src/lib/ontology/__generated__/enums.ts
#   heritage_graph/apps/graph/ontology_config.py
#
# ─────────────────────────────────────────────────────────────────────────────
# ADDING A NEW NODE TYPE
#   1. Add / verify the class in ontology/HeritageGraph.yaml with a class_uri.
#   2. Add a new entry in node_types below.
#   3. Run: python3 tools/gen_heritage_viz_config.py
#   4. Commit all three changed files together.
# ─────────────────────────────────────────────────────────────────────────────

# Each node_type entry:
#   key          — TypeScript NodeType value (string key in generated config)
#   linkml_class — class name in ontology/HeritageGraph.yaml; generator resolves
#                  class_uri from there. Use an alias key when the VIZ type is a
#                  subtype or grouping that doesn't have its own schema class.
#   label        — Human-readable label for UI display
#   color        — Hex color for node fill
#   glow_color   — Hex color for node glow/highlight
#   emoji        — Single emoji for node icon
#   hg_category  — Graph domain category (must be a key in hg_categories below)

node_types:
  - key: Place
    linkml_class: Place
    label: Place
    color: "#10b981"
    glow_color: "#34d399"
    emoji: "\U0001F3D4"   # 🏔
    hg_category: spatial

  - key: Temple
    linkml_class: Temple
    label: Temple
    color: "#f59e0b"
    glow_color: "#fcd34d"
    emoji: "\U0001F6D5"   # 🛕
    hg_category: tangible

  - key: BuddhistMonument
    linkml_class: BuddhistMonument
    label: Buddhist Monument
    color: "#8b5cf6"
    glow_color: "#a78bfa"
    emoji: "☸"       # ☸
    hg_category: tangible

  - key: ArchitecturalStructure
    linkml_class: ArchitecturalStructure
    label: Architectural Structure
    color: "#ec4899"
    glow_color: "#f472b6"
    emoji: "\U0001F3DB"   # 🏛
    hg_category: tangible

  # Settlement is a Place subtype for urban settlements (no separate schema class)
  - key: Settlement
    linkml_class: Place
    label: Settlement
    color: "#06b6d4"
    glow_color: "#22d3ee"
    emoji: "\U0001F3D9"   # 🏙
    hg_category: spatial

  - key: Deity
    linkml_class: Deity
    label: Deity
    color: "#ef4444"
    glow_color: "#f87171"
    emoji: "\U0001FAB7"   # 🪷 lotus — sacred to Hindu & Buddhist deities (was ✨, which trivialised the concept)
    hg_category: conceptual

  - key: Festival
    linkml_class: Festival
    label: Festival
    color: "#f97316"
    glow_color: "#fb923c"
    emoji: "\U0001FA94"   # 🪔 diya lamp — South Asian festival symbol (was 🎉 party popper)
    hg_category: event

  - key: TimeSpan
    linkml_class: TimeSpan
    label: Time-Span
    color: "#6366f1"
    glow_color: "#818cf8"
    emoji: "\U0001F4DC"   # 📜
    hg_category: temporal

  - key: ReligiousTradition
    linkml_class: ReligiousTradition
    label: Religious Tradition
    color: "#14b8a6"
    glow_color: "#2dd4bf"
    emoji: "\U0001F4FF"   # 📿 prayer beads / mala — shared Hindu & Buddhist (was 🎨 artist palette)
    hg_category: conceptual

  # SacredSite is an ArchitecturalStructure subtype for consecrated sacred spaces
  - key: SacredSite
    linkml_class: ArchitecturalStructure
    label: Sacred Site
    color: "#84cc16"
    glow_color: "#a3e635"
    emoji: "\U0001F6D0"   # 🛐 place of worship — multi-faith sacred site (was 🌿 herb)
    hg_category: tangible

  - key: Person
    linkml_class: Person
    label: Person
    color: "#22c55e"
    glow_color: "#86efac"
    emoji: "\U0001F464"   # 👤
    hg_category: actor

  - key: Guthi
    linkml_class: Guthi
    label: Guthi
    color: "#0ea5e9"
    glow_color: "#7dd3fc"
    emoji: "\U0001F465"   # 👥 community/trust institution — pairs with Person 👤 (was 🏘 houses)
    hg_category: actor

  - key: IconographicObject
    linkml_class: IconographicObject
    label: Iconographic Object
    color: "#d946ef"
    glow_color: "#f0abfc"
    emoji: "\U0001F5BC"   # 🖼
    hg_category: tangible

  # HistoricalPeriod is a TimeSpan subtype for named historical periods
  - key: HistoricalPeriod
    linkml_class: TimeSpan
    label: Historical Period
    color: "#a3a3a3"
    glow_color: "#d4d4d4"
    emoji: "⏳"       # ⏳
    hg_category: temporal

  - key: Source
    linkml_class: DataSource
    label: Source
    color: "#78716c"
    glow_color: "#a8a29e"
    emoji: "\U0001F4DA"   # 📚
    hg_category: provenance

  - key: HistoricalEvent
    linkml_class: HistoricalEvent
    label: Historical Event
    color: "#facc15"
    glow_color: "#fde68a"
    emoji: "\U0001F4C5"   # 📅
    hg_category: event


# Domain category visual config.
# Keys are the allowed hg_category values referenced above.

hg_categories:
  tangible:
    color: "#3b82f6"
    border: "#2563eb"
    label: Tangible Heritage
  conceptual:
    color: "#8b5cf6"
    border: "#7c3aed"
    label: Conceptual Entities
  event:
    color: "#f59e0b"
    border: "#d97706"
    label: Events
  spatial:
    color: "#06b6d4"
    border: "#0891b2"
    label: Spatiotemporal
  temporal:
    color: "#6366f1"
    border: "#4f46e5"
    label: Temporal
  actor:
    color: "#22c55e"
    border: "#15803d"
    label: Actors & Institutions
  provenance:
    color: "#78716c"
    border: "#57534e"
    label: Provenance


# Slots from ontology/HeritageGraph.yaml that appear as edge labels in the
# graph visualization. The generator resolves slot_uri from the schema.
# Add the cidoc_note field only for custom HG properties not yet in the schema.

viz_predicates:
  - slot: has_current_location
    label: has current location
    # schema slot_uri: crm:P55_has_current_location

  - slot: is_component_of
    label: is component of
    # schema slot_uri: crm:P46i_forms_part_of

  - slot: associated_with
    label: associated with
    cidoc_note: "heritageGraph:associated_with"   # custom HG property, not yet in schema

  - slot: invokes_deity
    label: invokes deity
    # schema slot_uri: crm:P12_occurred_in_the_presence_of

  - slot: took_place_at
    label: took place at
    # schema slot_uri: crm:P7_took_place_at

  - slot: was_produced_by_event
    label: was produced by event
    # schema slot_uri: crm:P108i_was_produced_by

  - slot: was_derived_from_source
    label: was derived from source
    # schema slot_uri: prov:wasDerivedFrom

  - slot: has_component
    label: has component
    # schema slot_uri: crm:P46_is_composed_of

  - slot: carried_out_by
    label: carried out by
    # schema slot_uri: crm:P14_carried_out_by

  # ── Live-data backend edge labels ──
  # These are produced by heritage_graph_ui/src/lib/instance-graph.ts when
  # building edges from CIDOC API rawData. They do not correspond to LinkML
  # slots, so each carries a cidoc_note pointing to its nearest CIDOC analog.
  - slot: located_at
    label: located at
    cidoc_note: "crm:P53_has_former_or_current_location"

  - slot: co_located
    label: co-located with
    cidoc_note: "heritageGraph:co_located"

  - slot: mentions
    label: mentions
    cidoc_note: "heritageGraph:mentions"

  - slot: depicts
    label: depicts
    cidoc_note: "crm:P138_represents"

  - slot: manages
    label: manages
    cidoc_note: "heritageGraph:manages"

  - slot: tradition
    label: tradition
    cidoc_note: "heritageGraph:religious_tradition"

  - slot: style
    label: architectural style
    cidoc_note: "heritageGraph:architectural_style"

  - slot: type
    label: type
    cidoc_note: "crm:P2_has_type"

  - slot: structure_type
    label: structure type
    cidoc_note: "heritageGraph:structure_type"

  - slot: ritual_type
    label: ritual type
    cidoc_note: "heritageGraph:ritual_type"

  - slot: festival_type
    label: festival type
    cidoc_note: "heritageGraph:festival_type"

  - slot: guthi_type
    label: guthi type
    cidoc_note: "heritageGraph:guthi_type"

  - slot: monument_type
    label: monument type
    cidoc_note: "heritageGraph:monument_type"

  - slot: object_type
    label: object type
    cidoc_note: "heritageGraph:object_type"

  - slot: event_type
    label: event type
    cidoc_note: "heritageGraph:event_type"

  - slot: source_type
    label: source type
    cidoc_note: "heritageGraph:source_type"

  - slot: tradition_type
    label: tradition type
    cidoc_note: "heritageGraph:tradition_type"

  - slot: occupation
    label: occupation
    cidoc_note: "heritageGraph:occupation"

  - slot: performed_by
    label: performed by
    cidoc_note: "crm:P14_carried_out_by"

  - slot: technique
    label: technique
    cidoc_note: "crm:P32_used_general_technique"


# Subset of schema prefixes to emit into TypeScript and Python.
# Must be a subset of the prefixes defined in ontology/HeritageGraph.yaml.
# The generator validates this list against the schema and errors on unknown keys.

core_prefixes:
  - rdf
  - rdfs
  - owl
  - xsd
  - crm
  - heritageGraph
  - geo
  - prov

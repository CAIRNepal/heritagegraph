# ============================================================================
# SLOTS (PROPERTIES)
# ============================================================================

  KumariRetirementEvent:
    is_a: KumariLifecycleEvent
    class_uri: heritageGraph:KumariRetirementEvent
    description: 'Ritual or administrative event that formally ends a Living Goddess tenure, returning the person
      to secular status. Common triggers: first menstruation, injury causing blood loss, serious illness.'
    slots:
      - name
      - ended_tenure_of
      - has_timespan
      - note
      - carried_out_by
      - performed_by_group
      - took_place_at
      - has_assertion
      - was_documented_by
    slot_usage:
      name:
        required: true
        description: "Name of retirement event"

      
      ended_tenure_of:
        required: true
        range: KumariTenure
        description: "The Living Goddess tenure that this event terminated"
      has_timespan:
        required: true
        range: TimeSpan
        description: "When the retirement occurred"

      
      carried_out_by:
        range: Person
        multivalued: true
        description: "Priests or officials who performed the retirement ritual"
      took_place_at:
        range: Place
        description: "Where the retirement ceremony occurred"

    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
  KumariRole:
    # ALIASES (alpha.5): English/romanized altLabels per reviewer request.
    # Script-specific (Nepali/Newar) labels are deferred to a localization
    # layer; the ontology itself stays language-generic.
    aliases:
      - "Living Goddess"
      - "Royal Kumari"
    class_uri: heritageGraph:KumariRole
    broad_mappings:
      # URI POLICY (alpha.5): narrower than crm:E55_Type; moved from exact_mappings.
      - crm:E55_Type
    description: The role/office of Kumari (living-goddess embodiment) that a person assumes for the duration 
      of a KumariTenure. The role is the type; the tenure is the time-bounded holding of it; the person is the
      holder.
    slots:
      - role_deity
    mixins:
      - Entity
  KumariHouse:
    # ALIASES (alpha.5): romanized alternate term.
    aliases:
      - "Kumari Ghar"
    is_a: ReligiousStructure
    class_uri: heritageGraph:KumariHouse
    # MAPPING AUDIT (alpha.5): wikidata:Q2708161 is a spider species
    # (verified) -- wrong entity, and no class-level Wikidata concept for
    # 'Kumari house' was found -> removed.
    description: God-house residence of a Kumari during tenure (e.g., Kumari Ghar, Kathmandu). Specialised 
      ReligiousStructure.
  KumariEnthronementEvent:
    is_a: KumariLifecycleEvent
    class_uri: heritageGraph:KumariEnthronementEvent
    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    description: Ritual installing a selected girl into the Kumari role and residence, activating the tenure 
      (distinct from selection, which chooses her, and retirement, which ends it).
    slots:
      - name
      - bounds_tenure
      - enthroned_person
      - confers_role
      - has_timespan
      - carried_out_by
      - took_place_at
      - has_assertion
      - was_documented_by
    slot_usage:
      bounds_tenure:
        required: true
        description: The tenure this enthronement activates (required tenure edge for this event type).
      enthroned_person:
        range: Person
        required: true
        slot_uri: heritageGraph:enthronedPerson
        description: Girl enthroned as Kumari.
      confers_role:
        range: KumariRole
        required: true
        slot_uri: heritageGraph:confersRole
        description: KumariRole conferred by this enthronement.
  SelectionCriterion:
    class_uri: heritageGraph:SelectionCriterion
    broad_mappings:
      # URI POLICY (alpha.5): narrower than crm:E55_Type; moved from exact_mappings.
      - crm:E55_Type
    description: An eligibility criterion a candidate must satisfy to assume the Kumari role. Modelled as 
      explicit subclasses so 'what are the eligibility criteria?' is a subclass query, not free text.
    mixins:
      - Entity
  AgeCriterion:
    is_a: SelectionCriterion
    class_uri: heritageGraph:AgeCriterion
    description: Candidate must be within the prescribed pre-pubescent age range.
  LineageCriterion:
    is_a: SelectionCriterion
    class_uri: heritageGraph:LineageCriterion
    description: Candidate must belong to an eligible lineage (Shakya / Vajracharya Newar Buddhist family).
  ThirtyTwoPerfectionsCriterion:
    # ALIASES (alpha.5): romanized alternate term.
    aliases:
      - "Battis Lakshana"
    is_a: SelectionCriterion
    class_uri: heritageGraph:ThirtyTwoPerfectionsCriterion
    description: Candidate must exhibit the battis lakshana (thirty-two perfections/auspicious bodily marks).
  HoroscopeCompatibilityCriterion:
    is_a: SelectionCriterion
    class_uri: heritageGraph:HoroscopeCompatibilityCriterion
    description: Candidate's horoscope must be compatible with the city and ruling authority.
  PhysicalIntegrityCriterion:
    is_a: SelectionCriterion
    class_uri: heritageGraph:PhysicalIntegrityCriterion
    description: Candidate must have an unblemished body with no scars, wounds, or loss of blood/teeth.
  RitualAssessment:
    is_a: RitualEvent
    abstract: true
    class_uri: heritageGraph:RitualAssessment
    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    description: A performed assessment carried out during Kumari selection. Modelled as an event (not a hard 
      criterion) so that source-specific, possibly conflicting accounts of whether/how it was conducted attach
      as provenanced Assertions rather than being asserted as fact.
    slots:
      - assesses_candidate
      - part_of_selection
      - has_assertion
      - was_documented_by
      - carried_out_by
      - has_timespan
  FearlessnessAssessment:
    is_a: RitualAssessment
    class_uri: heritageGraph:FearlessnessAssessment
    description: The 'fearlessness test' popularly described (animal heads, masked dancers in darkness). Its 
      historical and contemporary practice is DISPUTED -- some former Kumaris contest how it is described. 
      Represented as an assessment whose accounts are source-attributed via has_assertion, NOT as a mandatory 
      criterion.
    annotations:
      skos:scopeNote: 'Deliberately not a SelectionCriterion subclass: popular accounts and lived testimony disagree.
        Attach each account as a Assertion (CRMinf I2 Belief) with its own source and confidence.'

  AssertableEntity:
    class_uri: crminf:E1_Entity
    description: "Any entity that can be the subject of a heritage assertion"
    union_of:
      - HumanMadeObject
      - ArchitecturalStructure
      - IconographicObject
      - ArchitecturalElement
      - Deity
      - Person
      - Guthi
      - CasteGroup
      - Place
      - TimeSpan
      - Material
      - Technique

  BuddhistMonument:
    is_a: ArchitecturalStructure
    class_uri: heritageGraph:BuddhistMonument
    description: "Buddhist sacred structure (Stupa, Chaitya) with circumambulation and ritual activation patterns"
    disjoint_with:
      - Temple
      - RestHouse
      - WaterStructure
    exact_mappings:
      - aat:300007576  # stupa
      - wikidata:Q177980

  CulturalEntity:
    class_uri: heritageGraph:CulturalEntity
    description: "High-level cultural contribution (monuments, festivals, rituals, traditions, artifacts) for the heritage_data review workflow."
    slots:
      - name
      - category
      - description
    slot_usage:
      name:
        required: true
      category:
        required: true
      description:
        required: true

  Group:
    class_uri: crm:E74_Group
    description: "CIDOC-CRM/LinkedArt interop class for Yale LUX alignment (not user-contributable)."

  HeritageAssertion:
    class_uri: crminf:I2_Belief
    description: "A single factual claim about a heritage entity, with explicit source, author, date, and confidence"
    disjoint_with:
      - DataSource
      - DocumentationActivity
    exact_mappings:
      - schema:Claim
    broad_mappings:
      - prov:Entity
    slots:
      - assertion_content
      - asserts_about_entity
      - asserts_about_event
      - was_derived_from_source
      - was_attributed_to_agent
      - generated_at_time
      - confidence_score
      - data_quality_note
      - reconciliation_status
      - justification_note
      - crminf_conclusion
      # to track what is being asserted
      - asserted_property
      - asserted_value
      - supersedes_assertion
    slot_usage:
      asserted_property:
        required: true
      asserted_value:
        required: true
      was_derived_from_source:
        minimum_cardinality: 1
      generated_at_time:
        required: true

  HistoricalPeriod:
    class_uri: heritageGraph:HistoricalPeriod
    description: "A named, time-bounded historical period of Nepal (e.g., Lichhavi,
      Malla, Shah). A temporal frame within which heritage entities and events are
      situated — distinct from a single HistoricalEvent."
    broad_mappings:
      - crm:E4_Period
    close_mappings:
      - edm:TimeSpan
    disjoint_with:
      - Person
      - Place
      - Deity
    slots:
      - name
      - note
      - has_timespan
    slot_usage:
      name:
        required: true

  LivingGoddessRetirement:
    is_a: RitualEvent
    class_uri: heritageGraph:LivingGoddessRetirement
    description: "Ritual or administrative event that formally ends a Living Goddess tenure,
      marking the person's return to secular status. Common triggers include
      first menstruation, injury causing blood loss, or serious illness.
      This event terminates the divine embodiment and restores the girl to ordinary status."
    disjoint_with:
      - LivingGoddessSelection
    broad_mappings:
      - crm:E7_Activity
    slots:
      - name
      - ended_tenure_of
      - has_timespan
      - note
      - carried_out_by
      - performed_by_group
      - took_place_at
      - has_provenance_assertion
      - was_documented_by
    slot_usage:
      name:
        required: true
        description: "Name of retirement event"
      ended_tenure_of:
        required: true
        range: LivingGoddessTenure
        minimum_cardinality: 1
        maximum_cardinality: 1
        description: "The Living Goddess tenure that this event terminated"
      has_timespan:
        required: true
        range: TimeSpan
        description: "When the retirement occurred"
      carried_out_by:
        range: Person
        multivalued: true
        description: "Priests or officials who performed the retirement ritual"
      took_place_at:
        range: Place
        description: "Where the retirement ceremony occurred"

  LivingGoddessSelection:
    is_a: RitualEvent
    class_uri: heritageGraph:LivingGoddessSelection
    description: "Tantric ritual process of selecting a new Living Goddess from eligible candidates.
      Involves examination of 32 auspicious physical marks (lakshana), horoscope matching
      with the city and ruling authority, and tests of fearlessness (e.g., remaining calm
      among buffalo heads and masked dancers in darkness). Performed by committee of
      Vajracharya priests, royal priest (Raj Jyotish), and astrologer."
    disjoint_with:
      - LivingGoddessRetirement
    broad_mappings:
      - crm:E7_Activity
    slots:
      - name
      - selected_person
      - initiated_tenure
      - has_timespan
      - carried_out_by
      - performed_by_group
      - took_place_at
      - selection_criteria_met
      - has_provenance_assertion
      - was_documented_by
      - is_critical_for_festival
    slot_usage:
      name:
        required: true
        description: "Name of selection event"
      selected_person:
        required: true
        range: Person
        minimum_cardinality: 1
        maximum_cardinality: 1
        description: "Girl selected to become Living Goddess"
      initiated_tenure:
        required: true
        range: LivingGoddessTenure
        minimum_cardinality: 1
        maximum_cardinality: 1
        description: "Living Goddess tenure that this selection event initiated"
      selection_criteria_met:
        range: string
        multivalued: true
        description: "List of selection criteria verified"

  LivingGoddessTenure:
    class_uri: crm:E4_Period
    description: "Time-bounded role where a person embodies a deity as Living Goddess (Kumari),
      residing at a specific god-house and supported by religious institutions.
      This class captures the unique Nepali tradition of living deity embodiment
      in young girls selected from Buddhist Shakya/Vajracharya families."
    slots:
      - name
      - had_participant
      - embodied_deity
      - residence_structure
      - has_timespan
      - supported_by_institution
      - has_retirement_event 
      - was_documented_by
    slot_usage:
      name:
        required: true
        description: "Name of this tenure period (e.g., 'Kumari Samita Bajracharya Tenure 2015-2023')"
      had_participant:
        required: true
        range: Person
        minimum_cardinality: 1
        maximum_cardinality: 1
        description: "The girl serving as Living Goddess during this period"
      embodied_deity:
        required: true
        range: Deity
        minimum_cardinality: 1
        maximum_cardinality: 1
        description: "Deity believed to be present in this person (e.g., Taleju, Kumari Devi)"
      residence_structure:
        required: true
        range: ArchitecturalStructure
        minimum_cardinality: 1
        maximum_cardinality: 1
        description: "God-house where Living Goddess resides (e.g., Kumari Ghar)"
      has_timespan:
        required: true
        range: TimeSpan
        description: "Duration of Living Goddess tenure (from selection to retirement)"
      supported_by_institution:
        range: Guthi
        multivalued: true
        description: "Guthi or state body providing economic/ritual support during tenure"

  Set:
    class_uri: la:Set
    description: "CIDOC-CRM/LinkedArt interop class for Yale LUX alignment (not user-contributable)."
slots:
  architectural_structures:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of occurred_in_presence_of.
    slot_uri: heritageGraph:architecturalStructures
    is_a: occurred_in_presence_of
    range: ArchitecturalStructure
    multivalued: true
    description: "Heritage structures affected by or present during this historical event"



  id:
    identifier: true
    range: uriorcurie
    required: true
    description: "Globally unique URI identifier"
    slot_uri: dcterms:identifier
    exact_mappings:
      - schema:identifier

  route_places:
    # PREDICATE FIX (alpha.5): previously reused crm:P7_took_place_at, making a
    # procession route indistinguishable from an event venue. Minted subproperty
    # of took_place_at (rdfs:subPropertyOf crm:P7 via is_a).
    slot_uri: heritageGraph:routePlaces
    is_a: took_place_at
    range: Place
    multivalued: true

    description: "Ordered list of places visited during movement ritual"

  start_place:
    slot_uri: heritageGraph:startPlace
    range: Place
    description: "Starting location of movement ritual"

  end_place:
    slot_uri: heritageGraph:endPlace
    range: Place
    description: "Ending location of movement ritual"

  route_description:
    slot_uri: heritageGraph:routeDescription
    range: string
    description: "Text description of the procession route"

  name:
    slot_uri: rdfs:label
    range: string
    description: "Primary name or label"

  is_component_of:
    slot_uri: crm:P46i_forms_part_of
    range: ArchitecturalStructure
    description: "Larger structure that this element is part of"


  note:
    slot_uri: crm:P3_has_note
    range: string
    description: "Free-text note (description, reason, verification notes)"

    # ============================================================================
  # LIVING GODDESS (KUMARI) SLOTS
  # ============================================================================

  had_participant:
    # CRM D/R FIX (alpha.5): P11_had_participant has domain E5 Event, but this
    # slot's owner (KumariTenure) is a period, not an event; CRM defines no
    # participation property for E4 Period. Minted.
    slot_uri: heritageGraph:hadParticipant
    range: Actor
    multivalued: true
    description: "Actor(s) participating in this period or situation (e.g. the girl holding a Kumari tenure)."

  embodied_deity:
    # CRM D/R FIX (alpha.5): P14.1_in_the_role_of is not a first-class property
    # -- in CRM RDF it exists only on the reified PC14_carried_out_by node and
    # its range is E55 Type. No CRM property links a tenure directly to an
    # embodied deity; minted. (A qualified-role pattern via PC14 or
    # prov:qualifiedAssociation is the candidate future refactor.)
    slot_uri: heritageGraph:embodiedDeity
    range: Deity
    description: "Deity role embodied by participant"

  residence_structure:
    # CRM D/R FIX (alpha.5): P74's range is E53 Place; CRM strictly separates
    # physical things from places, so targeting a structure (E22) violated the
    # range. Minted; alternatively assert P74 to the structure's Place.
    slot_uri: heritageGraph:residenceStructure
    range: ArchitecturalStructure
    description: "Structure where a person resides during a specific period. For Living Goddess, this is typically
      a Kumari Ghar (god-house)."


  supported_by_institution:
    slot_uri: heritageGraph:supportedByInstitution
    range: Guthi
    multivalued: true
    description: "Institution(s) providing economic support (stipend, land endowment) or ritual support (priest
      salaries) for a Living Goddess during tenure. Extends Guthi role beyond structure management to person support."



  ended_tenure_of:
    slot_uri: heritageGraph:endedTenureOf
    # KUMARI WIRING (alpha.5): now a specialization of bounds_tenure (one
    # canonical event->tenure edge family) and the declared inverse of
    # retired_through.
    is_a: bounds_tenure
    range: KumariTenure
    description: "Points from a KumariRetirementEvent to the tenure that it terminated. Enables reconstruction
      of the complete Kumari lifecycle."
    inverse: retired_through

  # KUMARI WIRING (alpha.5): has_retirement_event deleted -- it duplicated
  # retired_through as a second tenure->retirement edge, and its IRI still
  # carried the pre-rename name hasTenureEndEvent. retired_through is now the
  # declared inverse of ended_tenure_of.

  selected_person:
    slot_uri: heritageGraph:selectedPerson
    range: Person
    description: "Person selected through a ritual selection process to assume a sacred role or office"

  initiated_tenure:
    slot_uri: heritageGraph:initiatedTenure
    # KUMARI WIRING (alpha.5): specialization of bounds_tenure; declared
    # inverse of selected_through.
    is_a: bounds_tenure
    range: KumariTenure
    description: "Kumari tenure that was initiated by this selection event"
    inverse: selected_through

  selection_criteria_met:
    slot_uri: heritageGraph:selectionCriteriaMet
    range: string
    multivalued: true
    description: "DEPRECATED free-text list; use has_criterion -> SelectionCriterion subclasses instead. Retained
      for backward compatibility."

    # CONSTRAINT FIX (alpha.5): machine-readable LinkML deprecated metaslot
    # instead of a free-text annotation that generators ignore.
    deprecated: "Deprecated free-text criteria list; use has_criterion -> SelectionCriterion subclasses."
  has_timespan:
    slot_uri: crm:P4_has_time-span
    range: TimeSpan
    description: "Links event to its temporal extent"



  date_earliest:
    slot_uri: crm:P82a_begin_of_the_begin
    range: date
    description: "Earliest possible date (for uncertain dates)"

  date_latest:
    slot_uri: crm:P82b_end_of_the_end
    range: date
    description: "Latest possible date (for uncertain dates)"

  calendar_system:
    slot_uri: heritageGraph:calendarSystem
    range: CalendarSystem
    description: "Calendar system used for date representation"

  lunar_date_tithi:
    slot_uri: heritageGraph:lunarDateTithi
    range: string
    description: "Lunar day (Tithi) for ritual timing"

  recurrence_pattern:
    slot_uri: heritageGraph:recurrencePattern
    range: string
    description: "Frequency of recurring ritual (e.g., annual, monthly)"

  birth_timespan:
    # PREDICATE FIX (alpha.5): previously reused crm:P4_has_time-span, colliding
    # with death_timespan/has_timespan (identical predicates in RDF, so birth and
    # death dates were indistinguishable). Minted subproperty; is_a has_timespan
    # emits rdfs:subPropertyOf crm:P4_has_time-span, preserving CRM compatibility.
    slot_uri: heritageGraph:birthTimespan
    is_a: has_timespan
    range: TimeSpan
    description: "Person's birth timespan"

  death_timespan:
    # PREDICATE FIX (alpha.5): see birth_timespan.
    slot_uri: heritageGraph:deathTimespan
    is_a: has_timespan
    range: TimeSpan
    description: "Person's death timespan"

  publication_timespan:
    # PREDICATE FIX (alpha.5): previously reused crm:P4_has_time-span. Minted
    # subproperty of has_timespan (rdfs:subPropertyOf crm:P4 via is_a).
    slot_uri: heritageGraph:publicationTimespan
    is_a: has_timespan
    range: TimeSpan
    description: "When source was published"

  # --- SPATIAL PROPERTIES ---


  place_coordinates:
    slot_uri: geo:asWKT
    range: wktLiteral
    description: "Coordinates as WKT literal"

  place_type:
    # DL FIX (alpha.6): dropped is_a has_type. A string-valued slot cannot
    # specialize crm:P2_has_type (an object property ranging over E55 Type):
    # the generated SubObjectPropertyOf over a datatype property is an
    # OWL Full pun. Free-text typing stays; CRM alignment would require an
    # E55-backed vocabulary first.
    slot_uri: heritageGraph:placeType
    range: string
    description: "Type of place (city, village, region), free text"

  has_current_location:
    slot_uri: crm:P55_has_current_location
    range: Place
    description: "Current location of object or structure"

  took_place_at:
    slot_uri: crm:P7_took_place_at
    range: Place
    description: "Place where the event occurred"

  ritual_on_structure:
    slot_uri: crm:P8_took_place_on_or_within
    range: PhysicalHeritageThing
    description: "Ritual occurs at specific temple or monument"



  contains_structure:
    slot_uri: crm:P53i_is_former_or_current_location_of
    range: ArchitecturalStructure
    multivalued: true
    description: "Structures located in this place"

  # --- EVENT-CENTRIC PRODUCTION RELATIONSHIPS ---
  is_primary_for_tradition:
    slot_uri: heritageGraph:isPrimaryForTradition
    range: ReligiousTradition
    multivalued: true
    description: "Religious tradition(s) that primarily use this calendar system (e.g., Bikram Sambat for Hindu,
      Nepal Sambat for Newar Buddhist)"

  existence_status:
    slot_uri: heritageGraph:existenceStatus
    range: ExistenceStatus
    description: "Current physical status of the structure"

  last_known_existence_date:
    slot_uri: heritageGraph:lastKnownExistenceDate
    range: date
    description: "Latest date when this structure is documented as existing (ISO 8601)"

  destruction_event:
    slot_uri: heritageGraph:destructionEvent
    range: DestructionEvent
    description: "Event that destroyed this structure (if known)"

  hypothesized_location:
    slot_uri: heritageGraph:hypothesizedLocation
    range: Place
    multivalued: true
    description: "Possible locations if the structure is lost"

  documented_in_source:
    slot_uri: heritageGraph:mentionedInSource
    range: DataSource
    multivalued: true
    description: "Source(s) that mention/document this entity. Distinct from was_derived_from (which is prov:wasDerivedFrom
      for assertions). Entity-mention is not logical derivation."



    annotations:
      prov_alignment: prov:wasInfluencedBy
  was_produced_by_event:
    slot_uri: crm:P108i_was_produced_by
    range: Production
    description: "Event that created this object or structure"

  produced_object:
    slot_uri: crm:P108_has_produced
    range: PhysicalHeritageThing
    description: "Object produced by this production event"


  carried_out_by:
    slot_uri: crm:P14_carried_out_by
    range: Actor
    multivalued: true
    description: "Actor(s) who performed this event"
  used_by:
    slot_uri: heritageGraph:usedBy
    range: Actor
    multivalued: true
    description: "Actor(s) who use, handle, or are responsible for this object in ritual contexts"

  commissioned_by:
    # CRM D/R FIX (alpha.5): P17_was_motivated_by points to the motivating
    # thing, not the commissioning agent -- semantically wrong here. CRM's
    # idiom is a role-qualified P14 (PC14), a larger refactor; minted direct
    # property in the interim.
    slot_uri: heritageGraph:commissionedBy
    range: Actor
    multivalued: true
    description: "Person or group who commissioned production"


  used_technique:
    # CRM D/R FIX (alpha.5): P32_used_general_technique has range E55 Type, but
    # this slot's range is Technique (= E29 Design or Procedure). The official
    # property with range E29 is P33_used_specific_technique (P32/P33 were
    # swapped).
    slot_uri: crm:P33_used_specific_technique
    range: Technique
    multivalued: true
    description: "Craft technique used in production"

  # --- RITUAL EVENT RELATIONSHIPS ---

  occurred_in_presence_of:
    slot_uri: crm:P12_occurred_in_the_presence_of
    range: Entity
    multivalued: true
    description: "Generic CRM presence relation (P12): entity present at an event. Canonical holder of
      the CRM predicate; use the specific presence slots in data."

  invokes_deity:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of the canonical
    # crm:P12 holder occurred_in_presence_of.
    slot_uri: heritageGraph:invokesDeity
    is_a: occurred_in_presence_of
    range: Deity
    multivalued: true
    description: "Deity invoked or made present through ritual"

  occurs_before:
    slot_uri: crm:P120_occurs_before
    range: RitualEvent
    description: "Points to the next ritual in the canonical sequence."

  occurs_after:
    # URI FIX (alpha.5): crm:P120i_is_occurred_before_by does not exist; the
    # official CIDOC-CRM RDF inverse of P120_occurs_before is P120i_occurs_after.
    slot_uri: crm:P120i_occurs_after
    range: RitualEvent
    description: "Points to the prerequisite ritual."



  performed_by_group:
    is_a: carried_out_by
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty; carried_out_by
    # keeps crm:P14 as the canonical holder.
    slot_uri: heritageGraph:performedByGroup
    # DL FIX (alpha.5): without a base range, gen-owl defaulted this slot to a
    # datatype property, illegally punning crm:P14 as both ObjectProperty and
    # DatatypeProperty (flagged by Protege/HermiT). Actor is the sound base
    # range (Guthi and CasteGroup are both Actors); any_of refines it.
    range: Actor
    any_of:
      - range: Guthi
      - range: CasteGroup
    multivalued: true
    description: "Group (Guthi, caste) responsible for ritual"

  is_critical_for_festival:
    slot_uri: heritageGraph:isCriticalForFestival
    range: boolean
    description: "Whether this ritual is essential for the festival's completion"


  is_part_of_festival:
    slot_uri: crm:P9i_forms_part_of
    range: Festival
    description: "Larger festival this ritual is part of"

  has_religious_tradition:
    slot_uri: heritageGraph:hasReligiousTradition
    is_a: has_type
    range: ReligiousTradition
    multivalued: true
    description: "Religious tradition(s) within which this deity is venerated"

  includes_ritual_event:
    slot_uri: crm:P9_consists_of
    range: RitualEvent
    multivalued: true
    description: "Component rituals of festival"

  # PREDICATE FIX (alpha.5-final): eight semantically distinct typing slots
  # shared bare crm:P2_has_type; SHACL validation of the demonstrator proved
  # this collides inside single nodes (a Temple's style, and its religious
  # traditions, became indistinguishable P2 triples violating each other's
  # value constraints). Same repair pattern as P4/P7/P14i: one canonical P2
  # holder (has_type), minted subproperties for each typing axis.
  has_type:
    slot_uri: crm:P2_has_type
    description: "Generic CRM typing property (P2 has type). Canonical holder of the CRM predicate;
      use the specific typing slots below in data."

  ritual_type:
    slot_uri: heritageGraph:ritualType
    is_a: has_type
    range: RitualType
    description: "Classification of ritual (puja, jatra, consecration)"

  # --- DEITY-STRUCTURE RELATIONSHIPS (EVENT-MEDIATED) ---
  assigned_to_deity:
    slot_uri: crm:P140_assigned_attribute_to
    description: "The deity instance that is the subject of the syncretic claim."
    range: Deity
    required: true


  assigned_equivalent:
    slot_uri: crm:P141_assigned
    description: "The deity or sacred figure being identified as equivalent to the primary deity."
    range: Deity
    required: true
    multivalued: true

  syncretic_type:
    slot_uri: heritageGraph:syncreticType
    is_a: has_type
    description: "The typological nature of the syncretism (e.g., Ontological Identity, Functional Overlap, Iconographic
      Similarity)."
    range: SyncreticType
    recommended: true



  enshrines_deity_through_event:
    slot_uri: heritageGraph:enshrinesDeityThroughEvent
    range: Enshrinement
    multivalued: true
    description: "Enshrinement event that installed deity in temple"
    inverse: enshrined_in_structure

  used_materials:
    slot_uri: crm:P125_used_object_of_type
    range: Material
    multivalued: true
    description: "Ephemeral materials consumed during the ritual (e.g., oil, rice)."

  enshrined_deity:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of occurred_in_presence_of.
    slot_uri: heritageGraph:enshrinedDeity
    is_a: occurred_in_presence_of
    range: Deity
    description: "Deity installed through enshrinement"
    inverse: is_enshrined_through_event

  enshrined_in_structure:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of
    # ritual_on_structure (canonical crm:P8 holder; Temple is a
    # PhysicalHeritageThing member).
    slot_uri: heritageGraph:enshrinedInStructure
    is_a: ritual_on_structure
    range: Temple
    description: "Temple where deity was enshrined"
    inverse: enshrines_deity_through_event

  is_enshrined_through_event:
    slot_uri: heritageGraph:isEnshrinedThroughEvent
    range: Enshrinement
    multivalued: true
    description: "Events where this deity was enshrined"
    inverse: enshrined_deity

  depicts_deity:
    slot_uri: crm:P62_depicts
    range: Deity
    multivalued: true
    description: "Deity depicted iconographically (not cultic presence)"


  is_depicted_in:
    slot_uri: crm:P62i_is_depicted_by
    range: IconographicObject
    multivalued: true
    description: "Iconographic objects (murti, paubha) in which this deity is depicted."

  is_about_deity:
    # CRM D/R FIX (alpha.5): P129_is_about has domain E89 Propositional Object;
    # a Murti is physical, so this was a domain violation. Now a minted
    # specialization of depicts_deity (rdfs:subPropertyOf crm:P62_depicts,
    # whose E24 domain and E1 range fit; P62 is CRM's official depiction
    # shortcut of P65+P138).
    slot_uri: heritageGraph:isAboutDeity
    is_a: depicts_deity
    range: Deity
    description: "Deity represented and ritually associated with the Murti"

  consecrated_by_event:
    slot_uri: heritageGraph:consecratedByEvent
    range: Consecration
    description: "Consecration event that activated this murti"
    inverse: consecrated_object

  consecrated_object:
    # CRM D/R FIX (alpha.5): P11_had_participant has range E39 Actor; a Murti
    # is not an actor. P16_used_specific_object (E7 -> E70 Thing) is the
    # official CRM property for an object employed in an activity.
    slot_uri: crm:P16_used_specific_object
    range: Murti
    description: "Murti employed in (and transformed by) the consecration ritual"
    inverse: consecrated_by_event

  makes_deity_present:
    slot_uri: heritageGraph:makesDeityPresent
    range: Deity
    description: "Deity made present through consecration"

  is_invoked_in_ritual:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of was_present_at.
    slot_uri: heritageGraph:isInvokedInRitual
    is_a: was_present_at
    range: RitualEvent
    multivalued: true
    description: "Rituals where this deity is invoked"

  # --- GUTHI RELATIONSHIPS ---

  managed_by_guthi:
    slot_uri: heritageGraph:managedByGuthi
    range: Guthi
    multivalued: true
    description: "Guthi organization managing this structure or ritual"


  performs_ritual:
    # PREDICATE FIX (alpha.5): previously duplicated crm:P14i_performed with
    # carried_out_activity. carried_out_activity keeps the CRM predicate as the
    # canonical general form; this is now its minted subproperty
    # (rdfs:subPropertyOf crm:P14i_performed via is_a).
    slot_uri: heritageGraph:performsRitual
    is_a: carried_out_activity
    range: RitualEvent
    multivalued: true
    description: "Rituals performed by this Guthi"

  holds_custody_of:
    # CRM D/R FIX (alpha.5): P50_has_current_keeper points thing -> keeper;
    # this slot points keeper -> thing. Corrected to the official inverse.
    slot_uri: crm:P50i_is_current_keeper_of
    range: ArchitecturalStructure
    multivalued: true
    description: "Structures under Guthi custodianship"

  has_custody_event:
    slot_uri: crm:P30i_custody_transferred_through
    range: TransferOfCustody
    multivalued: true
    description: "Custody transfer events for this structure"

  transferred_object:
    slot_uri: crm:P30_transferred_custody_of
    range: PhysicalHeritageThing
    description: "Object transferred in custody event"

  transferred_from_actor:
    slot_uri: crm:P28_custody_surrendered_by
    range: Actor
    description: "Previous custodian"

  transferred_to_actor:
    slot_uri: crm:P29_custody_received_by
    range: Actor
    description: "New custodian (person or group)"

  transferred_to_guthi:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of
    # transferred_to_actor (canonical crm:P29 holder).
    slot_uri: heritageGraph:transferredToGuthi
    is_a: transferred_to_actor
    range: Guthi
    description: "New custodian (Guthi)"

  guthi_type:
    slot_uri: heritageGraph:guthiType
    is_a: has_type
    range: GuthiType
    description: "Type of Guthi (Si, Jatra, Temple)"

  has_membership:
    slot_uri: crm:P107_has_current_or_former_member
    range: Person
    multivalued: true
    description: "Members of Guthi organization"

  member_of_group:
    slot_uri: crm:P107i_is_current_or_former_member_of
    range: Guthi
    multivalued: true
    description: "Groups this person belongs to"

 
  traditional_role:
    slot_uri: heritageGraph:traditionalRole
    range: string
    description: "Hereditary occupation or ritual duty"

  # --- CONDITION ASSESSMENT ---

  has_condition_assessment:
    slot_uri: crm:P34i_was_assessed_by
    range: ConditionAssessment
    multivalued: true
    description: "Condition assessment events for this structure"
  has_condition_type:
    slot_uri: heritageGraph:hasConditionType
    is_a: has_type
    range: ConditionType
    description: "Categorization of the condition state"



  assessed_object:
    slot_uri: crm:P34_concerned
    range: PhysicalHeritageThing
    description: "Object assessed for condition"

  assessed_condition_state:
    slot_uri: crm:P35_has_identified
    range: ConditionState
    description: "Condition state identified by the assessment"

 

  epoch_date_gregorian:
    slot_uri: heritageGraph:epochDateGregorian
    range: string
    description: "The start date of this calendar era in Gregorian ISO format."

  year_offset_from_gregorian:
    slot_uri: heritageGraph:yearOffsetFromGregorian
    range: integer
    description: "Mathematical offset to convert to Common Era (e.g., +57 for BS)."
  date_precision:
    slot_uri: heritageGraph:datePrecision
    range: DatePrecision
    description: "The level of precision for a recorded date."

  # --- COMPONENTS ---

  has_component:
    slot_uri: crm:P46_is_composed_of
    range: ArchitecturalElement
    # CONSTRAINT FIX (alpha.5): a structure has many components; the slot was
    # accidentally single-valued.
    multivalued: true

    description: "Architectural elements composing structure"

  has_architectural_style:
    slot_uri: heritageGraph:hasArchitecturalStyle
    is_a: has_type
    range: ArchitecturalStyle
    description: "Architectural style classification"

  # --- PROVENANCE (PROV-O aligned with CIDOC) ---
  was_derived_from:
    slot_uri: prov:wasDerivedFrom
    range: Entity
    multivalued: true
    description: Entity from which this entity was derived.
  was_attributed_to:
    slot_uri: prov:wasAttributedTo
    range: Agent
    multivalued: true
    description: Agent to whom responsibility for this entity is attributed.
  was_generated_by:
    slot_uri: prov:wasGeneratedBy
    range: Activity
    description: Activity that generated this entity.
    inverse: generated
  generated_at_time:
    slot_uri: prov:generatedAtTime
    range: datetime
    description: "Time at which this entity was generated (ISO 8601)."


  used:
    slot_uri: prov:used
    range: Entity
    multivalued: true
    description: Entity used by this activity.
  generated:
    slot_uri: prov:generated
    range: Entity
    multivalued: true
    description: Entity generated by this activity.
    inverse: was_generated_by
  was_associated_with:
    slot_uri: prov:wasAssociatedWith
    range: Agent
    multivalued: true
    description: Agent associated with responsibility for this activity.
  was_informed_by:
    slot_uri: prov:wasInformedBy
    range: Activity
    multivalued: true
    description: Activity that informed this activity; PROV-O uses this when the intervening generated and used entity is unknown or omitted.
  was_influenced_by:
    slot_uri: prov:wasInfluencedBy
    any_of:
      - range: Entity
      - range: Activity
      - range: Agent
    multivalued: true
    description: General PROV-O influence relation. Prefer a more specific PROV relation whenever one applies.
  started_at_time:
    slot_uri: prov:startedAtTime
    range: datetime
    description: Time at which this activity started.
  ended_at_time:
    slot_uri: prov:endedAtTime
    range: datetime
    description: Time at which this activity ended.
  acted_on_behalf_of:
    slot_uri: prov:actedOnBehalfOf
    range: Agent
    multivalued: true
    description: Agent on whose behalf this agent acted.
  supersedes_assertion:
    slot_uri: prov:wasRevisionOf
    range: Assertion
    description: "Previous assertion that this one revises (version chain A1->A2->A3). Uses prov:wasRevisionOf (a
      derivation between entities); the latest assertion is the one with no incoming wasRevisionOf. NOTE: prov:invalidated
      was incorrect here (it is an Activity->Entity relation, not Entity->Entity)."

  institutional_affiliation:
    slot_uri: heritageGraph:institutionalAffiliation
    range: string
    description: "Institutional affiliation (e.g., Tribhuvan University, Nepal Heritage Society)"

  expertise_area:
    slot_uri: heritageGraph:expertiseArea
    range: string
    multivalued: true
    description: "Areas of expertise (e.g., Lichhavi inscriptions, Sanskrit epigraphy, Newari archaeology)"

  used_method:
    # CRM D/R FIX (alpha.5): P33's range is E29 Design or Procedure (an
    # object), but this slot is a free-text note; CRM has no literal-valued
    # technique property. Minted. (P33 now belongs to used_technique.)
    slot_uri: heritageGraph:usedMethod
    range: string
    description: "Documentation method used"

  used_equipment:
    # CRM D/R FIX (alpha.5): P16_used_specific_object is an object property
    # (range E70 Thing); using it with literal values is invalid OWL. Minted
    # literal-valued property instead.
    slot_uri: heritageGraph:usedEquipment
    range: string
    multivalued: true
    description: "Equipment used in documentation"

  # --- ASSERTION-LEVEL PROVENANCE ---

  assertion_content:
    slot_uri: prov:value
    range: string
    description: "The factual claim being asserted"

  asserts_proposition:
    slot_uri: crminf:J4_that
    range: Proposition
    multivalued: true
    description: "Machine-readable proposition(s) this assertion holds to be
      true (CRMinf J4 that). Complements the free-text assertion_content."

  proposition_subject:
    # DL FIX (alpha.6): rdf:subject/predicate/object are RDF reserved
    # vocabulary; OWL 2 DL forbids (re)declaring them as properties, which
    # made every generated artifact OWL Full. Minted heritageGraph IRIs
    # instead; the reification intent (rdf:Statement) stays documented via
    # the Proposition class close_mappings. No instance data used the old
    # IRIs (checked examples/*.ttl before the rename).
    slot_uri: heritageGraph:propositionSubject
    range: AssertionSubject
    description: "Entity the proposition is about (plays the role of rdf:subject)."

  proposition_predicate:
    slot_uri: heritageGraph:propositionPredicate
    range: uriorcurie
    description: "Property (URI/CURIE) claimed of the subject, e.g. crm:P108i_was_produced_by
      (plays the role of rdf:predicate)."

  proposition_object_entity:
    slot_uri: heritageGraph:propositionObjectEntity
    range: AssertionSubject
    description: "Object of the proposition when it is a heritage entity (plays the role of rdf:object)."

  proposition_object_literal:
    slot_uri: heritageGraph:propositionLiteralValue
    range: string
    description: "Object of the proposition when it is a literal value (e.g. a date)."

  source_language:
    # CRM D/R FIX (alpha.5): P72_has_language has domain E33 Linguistic Object
    # and object range E56 Language; used here on DataSource with a literal.
    # schema:inLanguage officially admits Text values on any resource.
    slot_uri: schema:inLanguage
    range: string
    description: "Language of the source material"

  confidence_score:
    slot_uri: heritageGraph:confidenceScore
    range: float
    # CONSTRAINT FIX (alpha.5): the 0.0-1.0 range promised in prose is now
    # machine-enforced.
    minimum_value: 0
    maximum_value: 1
    description: "Reliability score for assertion (0.0-1.0)"

  data_quality_note:
    slot_uri: heritageGraph:dataQualityNote
    range: string
    description: "Notes on data quality, completeness, or uncertainty"

  reconciliation_status:
    slot_uri: heritageGraph:reconciliationStatus
    range: string
    description: "Status of multi-source reconciliation (confirmed, conflicting, unverified)"

  # --- VERIFICATION ---

  verification_method:
    slot_uri: heritageGraph:verificationMethod
    range: string
    description: "Method used for verification (cross-check, expert review, field visit)"
  verified_assertion:
    slot_uri: heritageGraph:verifiedAssertion
    range: Assertion
    multivalued: true
    description: "Assertions verified by this activity"
  verified_by_expert:
    slot_uri: heritageGraph:verifiedByExpert
    is_a: carried_out_by
    range: Person
    multivalued: true
    description: "Expert who performed verification"
  source_citation:
    slot_uri: heritageGraph:sourceCitation
    is_a: note
    range: string
    description: "Formal citation of source"
  source_url:
    slot_uri: heritageGraph:sourceUrl
    range: string
    description: "URL or digital identifier for source"
  custodian_type:
    # DL FIX (alpha.6): dropped is_a has_type (same rationale as place_type:
    # a string slot cannot be a subproperty of object property crm:P2).
    slot_uri: heritageGraph:custodianType
    range: string
    description: "Type of custodian (government, academic, community), free text"

  carried_out_activity:
    slot_uri: crm:P14i_performed
    range: RitualEvent
    multivalued: true
    description: "Activities performed by this actor"

  was_present_at:
    slot_uri: crm:P12i_was_present_at
    range: RitualEvent
    multivalued: true
    description: "Generic CRM presence relation (P12i): event this entity was present at. Canonical
      holder of the CRM predicate; use the specific slots in data."

  participates_in_ritual:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of the canonical
    # crm:P12i holder was_present_at.
    slot_uri: heritageGraph:participatesInRitual
    is_a: was_present_at
    range: RitualEvent
    multivalued: true
    description: "Rituals in which this structure participates"

  was_documented_by:
    slot_uri: heritageGraph:documentedBy
    range: DocumentationActivity
    multivalued: true
    description: "Documentation event that recorded this (pre-existing) entity or event. Uses heritageGraph:documentedBy
      (aligned to prov:wasInfluencedBy). NOTE: prov:wasGeneratedBy was incorrect: a stupa is not *generated by*
      the survey that records it."
    is_a: was_influenced_by


  ###########################################################################
  #      DATA CITE IDENTIFIER TYPES ENUMERATION
  ##########################################################################
    annotations:
      prov_alignment: prov:wasInfluencedBy
    inverse: documents
  datacite_identifier:
    # URI FIX (alpha.5): datacite:identifier does not exist in the SPAR DataCite
    # ontology (its identifier property, datacite:hasIdentifier, is object-valued
    # via a datacite:Identifier node, not literal-valued). dcterms:identifier is
    # already the URI of the 'id' slot and reusing it would merge the two
    # predicates in RDF. A heritageGraph IRI is minted instead.
    slot_uri: heritageGraph:persistentIdentifier
    range: string
    description: "Persistent identifier for the source (DOI, archive ID, catalog number)"

  datacite_identifier_type:
    # URI FIX (alpha.5): datacite:identifierType does not exist in SPAR DataCite;
    # the official pattern is object-valued datacite:usesIdentifierScheme. No
    # literal-valued official term exists, so a heritageGraph IRI is minted.
    slot_uri: heritageGraph:identifierScheme
    range: string
    description: "Type of identifier (DOI, ISBN, Handle, LocalArchiveID)"

  datacite_creator:
    # URI FIX (alpha.5, revised): dcterms:creator is ALSO used as ontology-header
    # metadata; declaring it both ObjectProperty (slot) and AnnotationProperty
    # (header) is illegal punning in OWL 2 DL (flagged by Protege/HermiT).
    # Minted IRI with dcterms:creator kept as an exact mapping.
    slot_uri: heritageGraph:sourceCreator
    exact_mappings:
      - dcterms:creator
    range: Actor
    multivalued: true
    description: "Person or organization primarily responsible for creating the source"

  datacite_publisher:
    # URI FIX (alpha.5, revised): same punning issue as datacite_creator;
    # minted IRI with dcterms:publisher as an exact mapping.
    slot_uri: heritageGraph:sourcePublisher
    exact_mappings:
      - dcterms:publisher
    range: Actor
    description: "Entity responsible for making the source available"

  datacite_resource_type:
    # URI FIX (alpha.5): datacite:resourceType does not exist in SPAR DataCite
    # ('resourceTypeGeneral' is a DataCite kernel XML field with no RDF form).
    # A heritageGraph IRI is minted; consider dcterms:type with a controlled
    # class value in a future revision.
    slot_uri: heritageGraph:resourceType
    range: string
    description: "High-level DataCite resource type (Dataset, Text, Image, Audio, Interview)"
  documents:
    slot_uri: heritageGraph:documents
    range: AssertionSubject
    multivalued: true
    inverse: was_documented_by
    description: Pre-existing heritage entity or event recorded by this documentation activity (inverse of 
      was_documented_by).
  bounds_tenure:
    slot_uri: heritageGraph:boundsTenure
    range: KumariTenure
    # KUMARI WIRING (alpha.5): no longer globally required -- it double-
    # mandated the same fact next to initiated_tenure/ended_tenure_of, which
    # are now its specializations. Each concrete lifecycle event requires
    # exactly one tenure edge via slot_usage.
    description: The KumariTenure period that this lifecycle event bounds (initiates or terminates). Specialized
      by initiated_tenure (selection) and ended_tenure_of (retirement).
  role_deity:
    slot_uri: heritageGraph:roleDeity
    range: Deity
    description: Deity embodied by whoever holds this role (e.g., Taleju).
  enthroned_person:
    slot_uri: heritageGraph:enthronedPerson
    range: Person
    description: "Girl enthroned as Kumari by this enthronement event."
  confers_role:
    slot_uri: heritageGraph:confersRole
    range: KumariRole
    description: "KumariRole conferred by this selection or enthronement event."
  assesses_candidate:
    slot_uri: heritageGraph:assessesCandidate
    range: Person
    description: Candidate being assessed.
  part_of_selection:
    slot_uri: heritageGraph:partOfSelection
    range: KumariSelectionEvent
    description: Selection event this assessment is part of.
  has_criterion:
    slot_uri: heritageGraph:hasCriterion
    range: SelectionCriterion
    description: Eligibility criterion applied in this selection.
    multivalued: true
  # KUMARI WIRING (alpha.5): results_in_role deleted -- two names existed for
  # "yields this role" on sibling events; unified on confers_role.
  assumes_role:
    slot_uri: heritageGraph:assumesRole
    range: KumariRole
    description: KumariRole held during this tenure.
  selected_through:
    slot_uri: heritageGraph:selectedThrough
    range: KumariSelectionEvent
    description: Selection event that initiated this tenure.
    inverse: initiated_tenure
  enthroned_through:
    slot_uri: heritageGraph:enthronedThrough
    range: KumariEnthronementEvent
    description: Enthronement event that activated this tenure.
  retired_through:
    slot_uri: heritageGraph:retiredThrough
    range: KumariRetirementEvent
    description: Retirement/desanctification event that ended this tenure.
    inverse: ended_tenure_of
  has_assertion:
    slot_uri: heritageGraph:hasAssertion
    range: Assertion
    multivalued: true
    description: Provenance-bearing assertion made about this entity or event.
    inverse: asserts_about
  asserts_about:
    slot_uri: heritageGraph:assertsAbout
    range: AssertionSubject
    required: true
    description: Heritage entity or event that is the subject of this assertion.
    inverse: has_assertion
  is_about:
    slot_uri: crm:P129_is_about
    range: AssertionSubject
    multivalued: true
    description: Heritage entity or event described by this information object.

  archival_location:
    slot_uri: heritageGraph:archival_location
    range: string
    description: "Where stored (e.g., National Museum Kathmandu, British Library, URL)"

  asserted_property:
    slot_uri: heritageGraph:asserted_property
    range: string
    required: true
    description: "Property or attribute name (e.g., 'existence_status', 'hypothesized_location', 'construction_date')"

  asserted_value:
    slot_uri: heritageGraph:asserted_value
    range: string
    required: true
    description: "The value claimed for this property (e.g., 'Lost', 'Handigaun', '598 CE')"

  assertion_author:
    slot_uri: heritageGraph:assertion_author
    description: "The agent (scholar, priest, or tradition-bearer) making or recording the syncretic claim."
    range: Actor
    broad_mappings:
      - crm:P14_carried_out_by

  asserts_about_entity:
    slot_uri: heritageGraph:asserts_about_entity
    range: AssertableEntity
    description: "Entity that is the subject of this assertion"
    broad_mappings:
      - crm:P140_assigned_attribute_to

  asserts_about_event:
    slot_uri: heritageGraph:asserts_about_event
    range: RitualEvent
    description: "Event that is the subject of this assertion"
    broad_mappings:
      - crm:P141_assigned

  category:
    slot_uri: heritageGraph:entity_category
    range: CulturalEntityCategory
    description: "Domain category for a cultural entity contribution"

  created_by_documentation:
    slot_uri: prov:wasGeneratedBy
    range: DocumentationActivity
    description: "Documentation activity that produced this information object"
    inverse: produced_information_object

  crminf_conclusion:
    slot_uri: crminf:J2_concluded_that
    range: string
    description: "Optional CRMinf conclusion label (confirmed, refuted, uncertain)"

  description:
    slot_uri: schema:description
    range: string
    description: "Long-form narrative description"

  has_provenance_assertion:
    slot_uri: heritageGraph:has_provenance_assertion
    range: HeritageAssertion
    multivalued: true
    description: "Sourced statements about this item — who claimed what, and where it is documented. Optional for most contributors."
    annotations:
      ui_help: "A provenance assertion is a single sourced claim about this item (for example: 'Built in 1427, according to Slusser 1982'). You can leave this empty — reviewers and curators usually add assertions during review. Add one only if you have a specific source to cite."
      ui_example: "Founded in the 17th century (source: National Archives, ref. 2014/231)"

  has_retirement_event:
    slot_uri: heritageGraph:has_retirement_event
    range: LivingGoddessRetirement
    description: "Retirement event that ended this Living Goddess tenure"
    inverse: ended_tenure_of

  is_about_entity:
    slot_uri: heritageGraph:is_about_entity
    range: ArchitecturalStructure
    description: "Entity that this information object describes"
    broad_mappings:
      - crm:P129_is_about

  is_about_event:
    slot_uri: heritageGraph:is_about_event
    range: RitualEvent
    description: "Event that this information object describes"
    broad_mappings:
      - crm:P129_is_about

  justification_note:
    slot_uri: crminf:J4_that
    range: string
    description: "CRMinf justification or reasoning summary for this belief"

  produced_information_object:
    slot_uri: prov:generated
    range: InformationObject
    description: "Information object (record, document) produced by documentation"
    inverse: created_by_documentation

  source_type:
    slot_uri: heritageGraph:source_type
    range: string
    description: "Type of source: Manuscript, Inscription, FieldSurvey, 
      PublishedBook, Archive, MuseumCollection, OralHistoryInterview, etc."

  was_attributed_to_agent:
    slot_uri: prov:wasAttributedTo
    range: Person
    multivalued: true
    description: "Person who made this assertion"

  was_derived_from_source:
    slot_uri: prov:wasDerivedFrom
    range: DataSource
    multivalued: true
    description: "Source(s) from which this assertion was derived"

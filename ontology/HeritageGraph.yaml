  # ========================================================================
  # PROVENANCE CLASSES (PROV-O aligned with CIDOC)
  # ========================================================================

    mixins:
      - Entity
  AssertionSubject:
    # URI POLICY (alpha.5): narrower than the CRM class; IRI minted,
    # CRM identity moved to broad_mappings.
    class_uri: heritageGraph:AssertionSubject
    broad_mappings:
      - crm:E1_CRM_Entity
    description: "Any HeritageGraph entity or event that may be the subject of an assertion."
    union_of:
      - HumanMadeObject
      - ArchitecturalElement
      - Deity
      - ReligiousTradition
      - HistoricalEvent
      - RitualEvent
      # WIRING (alpha.5): standalone event classes added -- they carry
      # has_assertion / was_documented_by but were not union members, so
      # assertions could not legally target them.
      - Production
      - Consecration
      - Enshrinement
      - TransferOfCustody
      - ConditionAssessment
      - ConditionState
      - Actor
      - Place
      - TimeSpan
      - DataSource
      - DocumentationActivity
      - SyncreticRelationship
      - KumariTenure
      - Technique
      - Material
      - KumariRole
      - SelectionCriterion
      # CRMINF FIX (alpha.5): Assertion included so beliefs about beliefs
      # (CRMinf I7 Belief Adoption -- e.g. an expert re-endorsing or disputing
      # a prior claim) are expressible; CalendarSystem included so calendar-
      # conversion claims can be provenanced like any other statement.
      - Assertion
      - CalendarSystem
    # DL FIX (alpha.7): dropped the Entity mixin. It asserted
    # AssertionSubject rdfs:subClassOf prov:Entity, and because the union
    # contains activity classes (RitualEvent, Production, Consecration, ...)
    # every one of them was entailed both prov:Entity and prov:Activity --
    # unsatisfiable under PROV-O's own Entity/Activity disjointness. Found
    # by merged-vocabulary HermiT classification
    # (evaluation/reasoning_extras.py merged-import): 22 unsatisfiable classes.
    # A subject of an assertion is not intrinsically a PROV entity.
    abstract: true
  Assertion:

    class_uri: crminf:I2_Belief  # CRMinf I2 Belief (CRM-SIG argumentation extension; CRMinf itself is not an ISO standard)
    exact_mappings: []
    description: "A provenance-bearing belief or claim about a heritage entity or event. The assertion is represented
      as CRMinf I2 Belief and as a prov:Entity, allowing source, attribution, generation time, revision, confidence,
      and reconciliation status to be recorded explicitly."
    slots:
      - assertion_content
      - asserts_proposition
      - asserts_about
      - confidence_score
      - data_quality_note
      - reconciliation_status
      - supersedes_assertion
      - was_derived_from
      - was_attributed_to
      - was_generated_by
      - generated_at_time
    close_mappings:
      - schema:Claim
    related_mappings:
      - prov:Entity
    annotations:
      crminf_pattern: I2_Belief -J4_that-> I4_Proposition_Set; evidence via I5_Inference_Making 
        (J1_used_as_premise / J2_concluded_that); expert re-check via I7_Belief_Adoption
    mixins:
      - Entity
    slot_usage:
      was_derived_from:
        range: DataSource
        description: Source entities from which this assertion was derived.
      was_attributed_to:
        range: Agent
        description: Agent to whom the assertion is attributed.
      was_generated_by:
        range: DocumentationActivity
        description: Documentation activity that generated the assertion.
  Proposition:
    # CRMINF FIX (alpha.5): assertion_content alone was an opaque string --
    # nothing queryable, and no CRMinf I4 realization despite the annotation
    # advertising one. Proposition gives each Assertion an optional
    # machine-readable subject-predicate-object statement (a singleton
    # proposition set in CRMinf terms), linked via asserts_proposition
    # (crminf:J4_that). assertion_content remains for prose.
    class_uri: heritageGraph:Proposition
    description: "A single machine-readable proposition (subject - predicate -
      object) held true by an Assertion. Modelled as a singleton proposition
      set (CRMinf I4); the predicate is a URI/CURIE, the object either a
      heritage entity or a literal."
    broad_mappings:
      - crminf:I4_Proposition_Set
    # NOTE (alpha.5-final): rdf:subject/predicate/object have rdfs:domain
    # rdf:Statement, so Propositions are RDF statements under RDFS entailment;
    # declared explicitly rather than left implicit.
    close_mappings:
      - rdf:Statement
    mixins:
      - Entity
    slots:
      - proposition_subject
      - proposition_predicate
      - proposition_object_entity
      - proposition_object_literal
    slot_usage:
      proposition_subject:
        required: true
      proposition_predicate:
        required: true
  DataSource:

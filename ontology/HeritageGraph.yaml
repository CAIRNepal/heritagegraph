        required: true
        range: TimeSpan
        description: "Duration of Living Goddess tenure (from selection to retirement)"
      supported_by_institution:
        range: Guthi
        multivalued: true
        description: "Guthi or state body providing economic/ritual support during tenure"



    mixins:
      - Entity
  KumariLifecycleEvent:
    is_a: RitualEvent
    abstract: true
    class_uri: heritageGraph:KumariLifecycleEvent
    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    description: 'Abstract event that bounds a KumariTenure (selection, enthronement, or retirement). Each
      concrete subclass requires exactly one tenure edge via slot_usage: initiated_tenure (selection),
      ended_tenure_of (retirement), or bounds_tenure itself (enthronement).'
    slots:
      - bounds_tenure
  KumariSelectionEvent:
    is_a: KumariLifecycleEvent
    class_uri: heritageGraph:KumariSelectionEvent
    description: "Tantric ritual process of selecting a new Living Goddess from eligible candidates. Involves examination
      of 32 auspicious physical marks (lakshana), horoscope matching with the city and ruling authority, and tests
      of fearlessness (e.g., remaining calm among buffalo heads and masked dancers in darkness). Performed by committee
      of Vajracharya priests, royal priest (Raj Jyotish), and astrologer."


    

    slots:
      - name
      - selected_person
      - initiated_tenure
      - has_timespan
      - carried_out_by
      - performed_by_group
      - took_place_at
      # DL FIX (alpha.6): deprecated selection_criteria_met detached from this
      # class so no live axiom references a deprecated property (ROBOT report
      # deprecated_property_reference ERROR). The slot itself stays declared
      # (and owl:deprecated) for backward compatibility.
      - has_assertion
      - was_documented_by
      - is_critical_for_festival
      - has_criterion
      - confers_role
    slot_usage:
      name:
        required: true
        description: "Name of selection event"
      selected_person:
        required: true
        range: Person
        description: "Girl selected to become Living Goddess"
      initiated_tenure:
        required: true
        range: KumariTenure
        description: "Living Goddess tenure that this selection event initiated"

  
    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
  Technique:
    class_uri: crm:E29_Design_or_Procedure
    description: "Method or craft process used in production or ritual"
    slots:
      - name
      - note
    mixins:
      - Entity
  Material:
    class_uri: crm:E57_Material
    description: "Physical substance used in construction or crafting"
    slots:
      - name
      - note
    mixins:
      - Entity
  Container:
    tree_root: true
    description: "Root container for cultural heritage data instances. PLACEMENT RULE: put each instance in
      the most specific collection available (e.g. a Festival in festivals, not ritual_events; a Person in
      persons, not actors); broader collections exist for instances of the general classes only."
    # CONTAINER STATUS (alpha.6): retained in the published ontology because
    # the LinkML tree_root is what makes JSON/YAML data files loadable and the
    # JSON Schema/Python artifacts depend on it; it carries no domain
    # semantics. The design_note below travels into the OWL release as an
    # explicit machine-readable marker so consumers know to ignore it for
    # reasoning/domain modelling.
    annotations:
      design_note: 'Serialization construct, not a domain class: this is the LinkML tree_root
        that anchors JSON/YAML dataset serializations (its collection properties exist for
        data exchange only). Reasoners and domain queries should ignore it; RDF instance
        data does not need a Container node.'
    broad_mappings:

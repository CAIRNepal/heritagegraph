id: https://w3id.org/heritagegraph/schema
name: HeritageGraph
description: "An event-centric LinkML schema for representing Nepal cultural heritage information, aligned with CIDOC-CRM and PROV-O through exact/broad mappings and subproperty bridges. Enables provenance tracking, ritual-spatial-temporal reasoning, and multi-calendar date representation. Merges the upstream HeritageGraph 0.1.0 ontology draft into the deployed platform schema."
version: 1.1.0
license: CC-BY-4.0


imports:
  - linkml:types
default_range: string

types:
  wktLiteral:
    typeof: string
    uri: "http://www.opengis.net/ont/geosparql#wktLiteral"

enums:
  ConditionType:
    description: "Controlled vocabulary for the physical condition of heritage objects and structures."
    permissible_values:
      Good:
        description: "No significant damage"
        meaning: heritageGraph:Good
      Damaged:
        description: "Partially damaged"
        meaning: heritageGraph:Damaged
      Ruined:
        description: "Severely damaged or collapsed"
        meaning: heritageGraph:Ruined
      Restored:
        description: "Repaired and stabilized"
        meaning: heritageGraph:Restored


  ExistenceStatus:
    description: "Controlled vocabulary for whether a heritage structure still exists physically."
    permissible_values:
      Extant:
        description: "Currently exists in physical form"
        meaning: heritageGraph:Extant
      PartiallyExtant:
        description: "Fragments or ruins remain"
        meaning: heritageGraph:PartiallyExtant
      Destroyed:
        description: "Known to have been destroyed; no physical remains"
        meaning: heritageGraph:Destroyed
      Lost:
        description: "Existence documented but location/remains unknown"
        meaning: heritageGraph:Lost
      Hypothetical:
        description: "Reconstructed or theorized; never physically realized"
        meaning: heritageGraph:Hypothetical
      Unknown:
        description: "Existence status uncertain"
        meaning: heritageGraph:Unknown

  RitualType:
    description: "Controlled vocabulary of ritual and festival activity types in Kathmandu Valley living heritage."
    permissible_values:
      NityaPuja:
        description: "Daily mandatory worship"
        meaning: heritageGraph:NityaPuja
        # MAPPING AUDIT (alpha.5): aat:300055603 = 'ownership' (verified) --
        # wrong concept; removed.
      NaimittikaPuja:
        description: "Occasional/Festival worship"
        meaning: heritageGraph:NaimittikaPuja
      KamyaPuja:
        description: "Desire-based optional worship"
        meaning: heritageGraph:KamyaPuja
      Abhisheka:
        description: "Ritual bathing/anointing of deity"
        meaning: heritageGraph:Abhisheka
        # MAPPING AUDIT (alpha.5): aat:300264383 = 'sculpting' (verified) --
        # wrong concept; removed.
      Homa:
        description: "Fire offering ritual"
        meaning: heritageGraph:Homa
        # MAPPING AUDIT (alpha.5): aat:300264387 = 'images (object genre)' (verified) --
        # wrong concept; removed.
      Bhajan:
        description: "Devotional singing ritual"
        meaning: heritageGraph:Bhajan
        # MAPPING AUDIT (alpha.5): aat:300264388 = 'pictures (object genre)' (verified) --
        # wrong concept; removed.
      Yagna:
        description: "Vedic sacrifice ritual"
        meaning: heritageGraph:Yagna
        # MAPPING AUDIT (alpha.5): aat:300264386 = 'trimurti' (verified) --
        # wrong concept; removed.
      Vrata:
        description: "Vow observance ritual"
        meaning: heritageGraph:Vrata
        # MAPPING AUDIT (alpha.5): aat:300264389 = 'caliphates' (verified) --
        # wrong concept; removed.
      Jatra:
        description: "Festival procession ritual"
        meaning: heritageGraph:Jatra
        # MAPPING AUDIT (alpha.5): aat:300264390 = 'Capuchin (Christian order)' (verified) --
        # wrong concept; removed.
      ChariotProcession:
        description: "Ritual chariot pulling"
        meaning: heritageGraph:ChariotProcession
        # MAPPING AUDIT (alpha.5): aat:300254776 does not exist (HTTP 404);
        # replaced with the verified broader concept aat:300069290 =
        # 'processions'.
        broad_mappings:
          - aat:300069290
      MaskedPerformance:
        description: "Ritual masked dance"
        meaning: heritageGraph:MaskedPerformance
        # MAPPING AUDIT (alpha.5): aat:300264391 = 'Egyptology' (verified) --
        # wrong concept; removed.


      RitualConsecration:
        description: "Consecration/activation ritual"
        meaning: heritageGraph:RitualConsecration
      ProcessionRitual:
        description: "Ritual procession/movement"
        meaning: heritageGraph:ProcessionRitual
      InstallationRitual:
        description: "Installation/enshrinement ritual"
        meaning: heritageGraph:InstallationRitual
      DeinstallationRitual:
        description: "De-installation/conclusion ritual"
        meaning: heritageGraph:DeinstallationRitual
      ReturningRitual:
        description: "Return to normal state ritual"
        meaning: heritageGraph:ReturningRitual

      Circumambulation:
        description: "Ritual circular movement around sacred site"
        meaning: heritageGraph:Circumambulation
      RelicTour:
        description: "Procession with sacred relics between sites"
        meaning: heritageGraph:RelicTour
      ProcessionalMovement:
        description: "General ritual movement between locations"
        meaning: heritageGraph:ProcessionalMovement

  
    annotations:
      design_note: 'RitualType currently mixes three orthogonal axes: worship-frequency (NityaPuja/NaimittikaPuja/KamyaPuja),
        ritual form (Homa/Jatra/MaskedPerformance), and lifecycle (InstallationRitual/ReturningRitual). Consider
        splitting into RitualFrequency + RitualForm. Also: Circumambulation/ProcessionalMovement/ProcessionRitual/RelicTour
        overlap with RitualEvent.route_places/start_place/end_place/route_description -- pick one canonical mechanism
        for moving rituals.'
  DatePrecision:
    description: "Controlled vocabulary for the temporal precision of recorded heritage dates."
    permissible_values:
      Exact:
        description: "Precise date known"
        meaning: heritageGraph:Exact
      Year:
        description: "Year-level precision only"
        meaning: heritageGraph:Year
      Decade:
        description: "Within 10-year range"
        meaning: heritageGraph:Decade
      Century:
        description: "Within century range"
        meaning: heritageGraph:Century
      Circa:
        description: "Approximate date"
        meaning: heritageGraph:Circa

  #Syncretic relationship types
  SyncreticType:
    description: "Controlled vocabulary for kinds of syncretic theological relationships between deities."
    permissible_values:
      Equivalence:
        description: "Same deity in different traditions (e.g., Avalokiteshvara = Matsyendranath)"
        meaning: heritageGraph:Equivalence
      Appropriation:
        description: "Deity borrowed from one tradition into another"
        meaning: heritageGraph:Appropriation
      Fusion:
        description: "Intrinsically syncretic deity merging multiple traditions"
        meaning: heritageGraph:Fusion
      Historical:
        description: "Gradual syncretism over time"
        meaning: heritageGraph:Historical

  
  ArchitecturalStyle:
    description: "A vocabulary of architectural styles for South Asian heritage, mapped to CIDOC E55 Type."
    # ENUM URI FIX (alpha.6): `enum_uri: crm:E55_Type` made gen-owl emit the
    # enumeration class ON the external CIDOC-CRM IRI, redefining crm:E55_Type
    # as a local class labelled 'ArchitecturalStyle' with a closed member list
    # (ontology hijacking; asserting axioms on an external term constrains it
    # for every ontology that imports CRM). The enum now mints its own IRI
    # like every other HeritageGraph enum; the CRM relation is carried as a
    # broad mapping (an architectural style IS a kind of E55 Type, but this
    # closed five-value list is narrower than E55_Type itself).
    broad_mappings:
      - crm:E55_Type
    permissible_values:
      Pagoda:
        description: "Multi-tiered roof style indigenous to Nepal"
        meaning: aat:300004829
      Shikhara:
        description: "North Indian spire-shaped style"
        # MAPPING AUDIT (alpha.5): aat:300446671 = 'grīvā-śikhara' (verified)
        # names a specific sikhara variant, not the general style; no general
        # 'shikharas' AAT concept found -- meaning removed pending domain-
        # expert confirmation.
        # meaning: aat:300446671
      Dome:
        description: "Dome-based style (Mughal/Neo-classical influence)"
        # MAPPING AUDIT (alpha.5): aat:300001285 = 'onion domes' (verified)
        # is narrower than this generic value; replaced with the verified
        # aat:300001280 = 'domes (architectural elements)'.
        meaning: aat:300001280
      Chaitya:
        description: "Buddhist votive shrine style"
        meaning: aat:300007562
      Stupa:
        description: "Buddhist dome-shaped reliquary"
        meaning: aat:300007576

  #Guthi type enum
  GuthiType:
    description: "Controlled vocabulary of Guthi functional types (CRM E55_Type)"
    permissible_values:
      SiGuthi:
        description: "Funeral trust"
        meaning: heritageGraph:SiGuthi
      JatraGuthi:
        description: "Festival organization trust"
        meaning: heritageGraph:JatraGuthi
      PujaGuthi:
        description: "Daily worship trust"
        meaning: heritageGraph:PujaGuthi
      TempleGuthi:
        description: "Temple maintenance trust"
        meaning: heritageGraph:TempleGuthi
      NashaGuthi:
        description: "Music and dance trust"
        meaning: heritageGraph:NashaGuthi
      SanaGuthi:
        description: "Agricultural cooperative trust"
        meaning: heritageGraph:SanaGuthi
      SanGuthi:
        description: "Life-cycle ritual trust"
        meaning: heritageGraph:SanGuthi
      RajGuthi:
        description: "Royal endowment trust"
        meaning: heritageGraph:RajGuthi

  CulturalEntityCategory:
    description: "Domain category for a high-level cultural entity contribution."
    permissible_values:
      monument:
        title: "Monument"
        description: "Monument or built heritage"
      artifact:
        title: "Artifact"
      ritual:
        title: "Ritual"
      festival:
        title: "Festival"
      tradition:
        title: "Tradition"
      document:
        title: "Document"
      other:
        title: "Other"



prefixes:
  # SERIALIZATION FIX (alpha.5): the schema imports linkml:types but never
  # declared the linkml: prefix; strict loaders (e.g. PythonGenerator) fail
  # on the unresolvable CURIE.
  linkml: "https://w3id.org/linkml/"
  heritageGraph: "https://w3id.org/heritagegraph/"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  owl: "http://www.w3.org/2002/07/owl#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  skos: "http://www.w3.org/2004/02/skos/core#"
  dcterms: "http://purl.org/dc/terms/"
  geo: "http://www.opengis.net/ont/geosparql#"
  time: "http://www.w3.org/2006/time#"
  aat: "http://vocab.getty.edu/aat/"
  wikidata: "http://www.wikidata.org/entity/"
  # SERIALIZATION FIX (alpha.5): canonical schema.org RDF term URIs use
  # http:// (also what linkml:types declares); the https:// binding clashed
  # with the imported module and emitted non-canonical term URIs.
  schema: "http://schema.org/"
  dbo: "http://dbpedia.org/ontology/"
  prov: "http://www.w3.org/ns/prov#"
  crm: "http://www.cidoc-crm.org/cidoc-crm/"
  # URI FIX (alpha.5): current CRMsci releases on cidoc-crm.org are PDF/DOCX
  # only and http://www.cidoc-crm.org/crmsci/ term URIs do not dereference.
  # The namespace of the official CRMsci RDFS encodings, used by existing
  # CRMsci data, is the FORTH namespace below.
  crmsci: "http://www.ics.forth.gr/isl/CRMsci/"
  # URI FIX (alpha.5): CRMinf has no current official RDF release (cidoc-crm.org
  # publishes v1.2.1 as PDF/DOCX only) and http://www.cidoc-crm.org/crminf/ term
  # URIs do not dereference. The de-facto RDF namespace used by existing CRMinf
  # data and implementations (e.g. ResearchSpace) is the FORTH namespace below.
  crminf: "http://www.ics.forth.gr/isl/CRMinf/"
  rico: "https://www.ica.org/standards/RiC/ontology#"
  bibo: "http://purl.org/ontology/bibo/"
  vann: "http://purl.org/vocab/vann/"
  dct: "http://purl.org/dc/terms/"
  wgs84: "http://www.w3.org/2003/01/geo/wgs84_pos#"
  tgn: "http://vocab.getty.edu/tgn/"
  foaf: "http://xmlns.com/foaf/0.1/"
  la: "https://linked.art/ns/terms/"
  crmdig: "http://www.cidoc-crm.org/crmdig/"
  datacite: "http://purl.org/spar/datacite/"
  edm: "http://www.europeana.eu/schemas/edm/"
  geonames: "https://www.geonames.org/ontology#"

default_prefix: heritageGraph

annotations:
  owl:ontologyIRI: "https://w3id.org/heritagegraph/ontology"
  owl:versionIRI: "https://w3id.org/heritagegraph/ontology/0.1.0"
  owl:versionInfo: "0.1.0"
  dcterms:creator: "CAIR-Nepal"
  dcterms:publisher: "CAIR-Nepal"
  dcterms:license: "https://creativecommons.org/licenses/by/4.0/"
  # FAIR metadata (alpha.6)
  dcterms:created: "2025-11-23"
  dcterms:modified: "2026-07-22"
  dcterms:source: "https://github.com/CAIRNepal/heritagegraphontology"
  dcterms:bibliographicCitation: "CAIR-Nepal (2026). HeritageGraph Ontology (0.1.0). https://w3id.org/heritagegraph/ontology"
  bibo:status: "Pre-release specification draft"
  vann:preferredNamespacePrefix: "heritageGraph"
  vann:preferredNamespaceUri: "https://w3id.org/heritagegraph/"
  # CLEANUP (alpha.5): removed the owl:imports annotation -- it serialized as
  # one malformed space-separated literal, and alignment to CIDOC-CRM/PROV-O
  # is carried by mappings and subproperty bridges, not by importing the full
  # external ontologies.

classes:
  # ========================================================================
  # PROV-O STARTING-POINT CLASSES (DIRECT PROV URIs)
  # ========================================================================
  Entity:
    abstract: true
    mixin: true
    class_uri: prov:Entity
    description: "Direct LinkML representation of prov:Entity. Applied to physical, digital, conceptual, and
      assertion-bearing things that participate in provenance relations. PROVENANCE SCOPE (design
      decision): for classes whose instances are real-world referents (structures, deities, places, actors),
      the provenance slots (was_derived_from, was_attributed_to, was_generated_by, generated_at_time) describe
      the DATA RECORD about the referent, not the referent itself -- a stupa is not generated by the survey
      that records it. Referent-level history is modelled through events (Production, DestructionEvent, etc.).
      RDF deployments SHOULD carry record-level provenance in named graphs or on InformationObject/Assertion
      nodes."
    annotations:
      provenance_scope: record
    slots:
      - id
      - was_derived_from
      - was_attributed_to
      - was_generated_by
      - generated_at_time
      - was_influenced_by
  Activity:
    abstract: true
    mixin: true
    class_uri: prov:Activity
    description: Direct LinkML representation of prov:Activity. Applied to events and processes that use, 
      transform, generate, document, assess, or verify entities.
    slots:
      - id
      - used
      - generated
      - was_associated_with
      - was_informed_by
      - was_influenced_by
      - started_at_time
      - ended_at_time
  Agent:
    abstract: true
    mixin: true
    class_uri: prov:Agent
    description: Direct LinkML representation of prov:Agent. Agents bear responsibility for activities or entities. PROV-O permits an individual agent also to be typed as an Entity, but does not define every Agent as a subclass of Entity.
    slots:
      - id
      - acted_on_behalf_of
      - was_influenced_by
  # ========================================================================
  # CORE TANGIBLE HERITAGE (CIDOC E22 Human-Made Objects)
  # ========================================================================
  HumanMadeObject:
    class_uri: crm:E22_Human-Made_Object
    description: "Physical objects created by human activity"
    # MAPPING AUDIT (alpha.5, verified against live endpoints 2026-07-16):
    # schema:CreativeWork overlaps but is not equivalent (covers intangible
    # works) -> close. aat:300033618 = 'paintings (visual works)' -- wrong
    # concept here -> removed. wikidata:Q838948 = 'work of art' is narrower
    # than HumanMadeObject -> narrow_mappings.
    close_mappings:
      - schema:CreativeWork
    narrow_mappings:
      - wikidata:Q838948

    slots:
      - id
      - name
      - has_current_location
      - was_produced_by_event
      - has_condition_assessment
      - participates_in_ritual
      - has_custody_event
      - was_documented_by
    mixins:
      - Entity
    slot_usage:
      name:
        required: true
  ArchitecturalStructure:
    is_a: HumanMadeObject
    class_uri: heritageGraph:ArchitecturalStructure

    description: "Physical structures built for religious, social, or civic purposes. Links to events of production,
      use, custody, and documentation."
    # MAPPING AUDIT (alpha.5): aat:300006888 = 'fortifications' (verified) --
    # wrong concept -> removed. schema:Place is categorially disjoint from a
    # physical structure -> close. wikidata:Q811979 = 'architectural
    # structure' verified equivalent -> kept exact.
    exact_mappings:
      - wikidata:Q811979
    close_mappings:
      - schema:Place
    broad_mappings:
      # URI POLICY (alpha.5): narrower than crm:E22; moved from exact_mappings.
      - crm:E22_Human-Made_Object
    slots:
      - name
      - note
      - place_coordinates
      - was_produced_by_event
      - has_current_location
      - has_condition_assessment
      - has_component
      - has_architectural_style
      - existence_status
      - last_known_existence_date
      - destruction_event
      - hypothesized_location
      - documented_in_source
      - has_assertion
    slot_usage:
      name:
        required: true
      # CONSTRAINT FIX (alpha.5): has_current_location was unconditionally
      # required, contradicting ExistenceStatus Destroyed/Lost/Hypothetical
      # (and hypothesized_location, which exists for exactly that case). It is
      # now required only for (partially) extant structures via the rule below.
      #
      # (alpha.7): the unconditional `required: true` was left in place, so the
      # rule never got a chance to apply and the contradiction above was still
      # live. It also made every subclass unsubmittable where the Django model
      # has no such column — BuddhistMonument (registry key `monument`) has
      # only a `location_name` text column, so the serializer dropped the slot
      # and the JSON Schema gate rejected every monument contribution.
      # Conditional enforcement now comes solely from `rules:` below.
      has_current_location:
        maximum_cardinality: 1
    rules:
      - description: Extant or partially extant structures must record a current location.
        preconditions:
          slot_conditions:
            existence_status:
              any_of:
                - equals_string: Extant
                - equals_string: PartiallyExtant
        postconditions:
          slot_conditions:
            has_current_location:
              required: true

  ReligiousStructure:
    is_a: ArchitecturalStructure
    class_uri: heritageGraph:ReligiousStructure
    description: 'Architectural structure whose defining purpose is religious: enshrines a deity and/or is a locus
      of ritual activation. Abstract grouping for sacred structures across traditions (temple, stupa, chaitya).'
    # MAPPING AUDIT (alpha.5): aat:300007596 is the guide term '<temples by
    # form>' (verified) -- AAT guide terms are not mappable concepts -> removed.
  Temple:
    # ALIASES (alpha.5): romanized alternate term.
    aliases:
      - "Mandir"
    is_a: ReligiousStructure
    class_uri: heritageGraph:Temple

    description: "Religious structure characterized by deity enshrinement and ritual activation. Legal designation
      (e.g. 'Ancient Monument' under Nepal law) is recorded per-instance via a governance assertion, not as a class
      criterion."
    # MAPPING AUDIT (alpha.5): aat:300007595 = 'temples (buildings)' and
    # wikidata:Q44539 = 'temple' verified -> kept exact.
    # dbo:ReligiousBuilding is broader than Temple -> broad_mappings.
    exact_mappings:
      - aat:300007595
      - wikidata:Q44539
      - dbo:Temple
    broad_mappings:
      - dbo:ReligiousBuilding
    close_mappings:
      - schema:PlaceOfWorship
      - schema:HinduTemple
    slots:
      - enshrines_deity_through_event
      - has_architectural_style
    slot_usage:
      has_architectural_style:
        required: true




  Stupa:
    is_a: ReligiousStructure
    class_uri: heritageGraph:Stupa
    description: "Buddhist dome-shaped reliquary shrine with circumambulation and ritual activation (e.g., Boudhanath,
      Swayambhunath)."

    # MAPPING AUDIT (alpha.5): aat:300007576 = 'stupas' verified -> kept.
    # wikidata:Q177980 = 'Aemilian, Roman emperor' (verified) -- wrong entity;
    # replaced with the verified Q180987 = 'stupa'.
    exact_mappings:
      - aat:300007576
      - wikidata:Q180987
    disjoint_with:
      - Chaitya
  Chaitya:
    is_a: ReligiousStructure
    class_uri: heritageGraph:Chaitya
    description: "Buddhist votive shrine (chaitya); votive stupa form found across the Kathmandu Valley."

  RestHouse:
    is_a: ArchitecturalStructure
    class_uri: heritageGraph:RestHouse
    description: "Community structures for travelers and pilgrims, maintained by Guthi organizations"

  Pati:
    # ALIASES (alpha.5): romanized alternate term.
    aliases:
      - "Phalcha"
    is_a: RestHouse
    class_uri: heritageGraph:Pati
    description: "Open-air pavilion for resting travelers"

  Sattal:
    is_a: RestHouse
    class_uri: heritageGraph:Sattal
    description: "Multi-story rest house (3-5 floors) with ritual and social functions"

  Dharmashala:
    is_a: RestHouse
    class_uri: heritageGraph:Dharmashala
    description: "Pilgrim lodge operated by a Guthi organization"

  WaterStructure:
    is_a: ArchitecturalStructure
    class_uri: heritageGraph:WaterStructure
    description: "Engineered water supply systems with ritual and civic significance"

  DhungeDhara:
    # ALIASES (alpha.5): romanized alternate term.
    aliases:
      - "Hiti"
    is_a: WaterStructure
    class_uri: heritageGraph:DhungeDhara
    description: "Stone spout (hiti) with carved imagery, used for ritual bathing and daily water supply"

  Pokhari:
    is_a: WaterStructure
    class_uri: heritageGraph:Pokhari
    description: "Pond or tank for water storage, ritual bathing, and ecological management"

  IconographicObject:
    is_a: HumanMadeObject
    class_uri: heritageGraph:IconographicObject
    description: "Sacred visual art objects that depict or embody deities through iconographic conventions"
    # MAPPING AUDIT (alpha.5): aat:300033618 = 'paintings (visual works)' and
    # aat:300041273 = 'prints (visual works)' (verified) are wrong for a class
    # that includes statues -> removed. dbo:Artwork is broader -> moved to
    # broad_mappings.
    broad_mappings:
      - dbo:Artwork
      # URI POLICY (alpha.5): narrower than crm:E22; moved from exact_mappings.
      - crm:E22_Human-Made_Object
    close_mappings:
      - crm:E36_Visual_Item

    slots:
      - name
      - note
      - depicts_deity
      - was_produced_by_event
      - participates_in_ritual
      - has_current_location
      - used_by
    slot_usage:
      name:
        required: true
  Paubha:
    is_a: IconographicObject
    class_uri: heritageGraph:Paubha
    # MAPPING AUDIT (alpha.5): aat:300033618 = 'paintings (visual works)' is
    # broader than Paubha -> broad_mappings. wikidata:Q130993 was
    # unresolvable; replaced with the verified exact concept Q7148832 =
    # 'Paubha' (traditional religious painting of the Newar people).
    # Q916651 = 'thangka' (verified) added as close.
    exact_mappings:
      - wikidata:Q7148832
    broad_mappings:
      - aat:300033618
    close_mappings:
      - wikidata:Q916651
    description: "Traditional Newari scroll painting (thangka) with mandala and deity iconography"

  Murti:
    is_a: IconographicObject
    class_uri: heritageGraph:Murti
    description: "Consecrated statue of a deity, ritually activated to serve as divine presence (not merely depiction)"
    # MAPPING AUDIT (alpha.5): aat:300264383 = 'sculpting' (verified) -- an
    # activity, wrong for a statue -> removed. wikidata:Q2594295 is an insect
    # species (verified) -- wrong entity; replaced with the verified
    # Q1781039 = 'murti'.
    exact_mappings:
      - wikidata:Q1781039
    slots:
      - consecrated_by_event
      - is_about_deity
  ArchitecturalElement:
    # URI FIX (alpha.5): crm:E25_Architectural_Element does not exist in CIDOC-CRM.
    # The official E25 class is crm:E25_Human-Made_Feature (human-made features
    # attached to physical things, e.g. carvings), which matches this class's intent.
    # URI POLICY (alpha.5): narrower than the CRM class; IRI minted,
    # CRM identity moved to broad_mappings.
    class_uri: heritageGraph:ArchitecturalElement
    broad_mappings:
      - crm:E25_Human-Made_Feature

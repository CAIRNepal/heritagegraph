# ================================================================
# HeritageGraph Docker Compose - Production Override
# ================================================================
# This file overrides development settings for production.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ================================================================

services:
  # ---------------------------------------------------------------
  # PostgreSQL Database (Production)
  # ---------------------------------------------------------------
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ---------------------------------------------------------------
  # Traefik (Production - with HTTPS / Let's Encrypt)
  # ---------------------------------------------------------------
  traefik:
    restart: always
    command:
      # Disable insecure dashboard
      - "--api.insecure=false"
      - "--api.dashboard=true"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP to HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt TLS
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Logs
      - "--log.level=WARN"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      # Dashboard NOT exposed in production (comment out 8080)
      # - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/acme:/etc/traefik/acme
    labels:
      - "traefik.enable=true"
      # Dashboard behind HTTPS with basic auth
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:-example.com}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USER:-admin}:${TRAEFIK_DASHBOARD_PASSWORD}"

  # ---------------------------------------------------------------
  # Django Backend (Production)
  # ---------------------------------------------------------------
  backend:
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: settings.production
      DEBUG: "False"
      HERITAGEGRAPH_DEV_AUTH: "false"
      ALLOWED_HOSTS: ${DOMAIN:-example.com},www.${DOMAIN:-example.com},api.${DOMAIN:-example.com}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:-example.com},https://www.${DOMAIN:-example.com}
      # No dev fallback: an unset secret resolves to empty and production.py
      # rejects it (rather than inheriting the base compose's dev default).
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # Traefik terminates TLS and sets X-Forwarded-Proto; with
      # SECURE_PROXY_SSL_HEADER configured, Django can safely force HTTPS.
      SECURE_SSL_REDIRECT: "True"
    # Remove volume mounts for production (use baked-in image)
    volumes: []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-example.com}`) || Host(`backend.${DOMAIN:-example.com}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=rate-limit-auth@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/health/"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=10s"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ---------------------------------------------------------------
  # Next.js Frontend (Production)
  # ---------------------------------------------------------------
  frontend:
    restart: always
    # NEXT_PUBLIC_* are inlined at build time — they must be set as build args,
    # not only runtime environment, or the deployed bundle keeps build defaults
    # (e.g. localhost) and the app calls the wrong API.
    build:
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-example.com}
        NEXT_PUBLIC_APP_URL: https://${DOMAIN:-example.com}
        NEXT_PUBLIC_DEV_AUTH: "false"
        NEXT_PUBLIC_CESIUM_ION_ACCESS_TOKEN: ${NEXT_PUBLIC_CESIUM_ION_ACCESS_TOKEN:-}
    environment:
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-example.com}
      NEXTAUTH_URL: https://${DOMAIN:-example.com}
      NEXT_PUBLIC_DEV_AUTH: "false"
    # Remove dev volume mounts
    volumes: []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-example.com}`) || Host(`www.${DOMAIN:-example.com}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=security-headers@file,rate-limit-auth@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ---------------------------------------------------------------
  # Landing Page (Production)
  # ---------------------------------------------------------------
  landing:
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing.rule=Host(`landing.${DOMAIN:-example.com}`)"
      - "traefik.http.routers.landing.entrypoints=websecure"
      - "traefik.http.routers.landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.landing.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

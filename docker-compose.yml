version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chlod-backend
    ports:
      - "8000"
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=heritage_graph.settings.development
    # depends_on:
    #   - db

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/backend_nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chlod-frontend
    ports:
      - "3000:80"  # serve React on http://localhost:3000


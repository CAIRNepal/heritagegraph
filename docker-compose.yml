version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: heritage_backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  frontend_build:
    build:
      context: .
      target: build  # if you use multi-stage build with target 'build'
      dockerfile: Dockerfile.frontend
    container_name: heritage_frontend_build
    # No need to expose ports or run anything here since this is build stage

  nginx:
    image: nginx:latest
    container_name: heritage_nginx
    depends_on:
      - backend
      - frontend_build
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /app/heritage_graph_ui/build:/usr/share/nginx/html:ro